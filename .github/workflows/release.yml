name: Release

on:
  push:
    # release tags carry the FIRS version number, prefixed with cirs-, e.g. cirs-5.2.0
    tags: ["cirs-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make graphviz

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check translations
        run: python tools/check_translations.py

      - name: Build text docs, NewGRF, GameScript and site
        run: |
          make grf gs text_docs
          make site

      - name: Package GameScript and docs
        run: |
          tar -czf cirs-gs.tar.gz -C generated/gs .
          tar -czf cirs-docs.tar.gz -C docs-site/.vitepress/dist .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CIRS ${{ inputs.tag || github.ref_name }}
          files: |
            generated/cirs.grf
            cirs-gs.tar.gz
            cirs-docs.tar.gz
          generate_release_notes: true
