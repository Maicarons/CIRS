[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Conjunto de reemplazo de industrias comunitarias de CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Conjunto de reemplazo de industrias comunitarias de CIRS{}{BLACK}Un fork de FIRS mantenido por la comunidad, creado originalmente por andythenorth, FooBar, planetmaker, Terkhen y Yexo, con la ayuda de muchas otras personas. {SILVER}Consulta el sitio web para obtener más información, incluido cómo usar CIRS. {BLACK}Licencia: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Máxima distancia en casillas desde zonas pesqueras, plataformas petrolíferas y zonas de dragado hasta la costa."

[STR_PARAM_DESC_ECONOMIES]
base = "Cada economía ofrece una combinación distinta de cargamentos e industrias.{}{}Para aquellos que quieran un juego sencillo, las economías {SILVER}Básicas {BLACK}de CIRS presentan menos industrias y cargamentos que las demás.{}{}El sitio web de CIRS ofrece mayor información acerca de cada economía."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Máxima distancia en casillas desde industrias marítimas hasta la costa."

[STR_PARAM_NAME_ECONOMIES]
base = "Economía"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sin límite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Cajas de suministros necesarias para producción primaria Aumentada (16 por defecto)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Cajas de suministros necesarias para producción primaria Abundante (80 por defecto)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Al recibir cajas de suministros, granjas, minas e industrias similares subirán su producción a {SILVER}Aumentada{BLACK} y luego a {SILVER}Abundante{BLACK}, si se entregan suficientes cajas.{}{}El valor predeterminado es ideal pero puede cambiarse en este parámetro.{}{}Los requisitos de cargamento para las industrias portuarias serán 8 veces superiores a los establecidos aquí."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nivel de producción primaria Aumentada (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nivel de producción primaria Abundante (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Producción de granjas, minas e industrias similares cuando se cumplen los requisitos de cargamento (porcentaje del nivel {SILVER}Normal {BLACK}de producción)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Básica Templada"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Básica Subártica"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Básica Tropical"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "En un país cálido"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Acerera"

[STR_PARAM_NAME_OBJECTS]
base = "Objetos de paisajismo de CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS incluye un conjunto de objetos de paisajismo que los jugadores pueden colocar para que ciertas industrias parezcan más grandes. Los objetos de paisajismo no tienen ningún efecto en la jugabilidad. Se pueden activar o desactivar."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opcional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = "{BLACK}(suministrado)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Produce al nivel máximo si se suministra {WHITE}cualquier {BLACK}cargamento requerido."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Para alcanzar la tasa máxima de producción, proporciona {WHITE}ambos cargos {BLACK}requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Para alcanzar la tasa máxima de producción, proporciona {WHITE}todos los {BLACK}cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Para alcanzar la tasa máxima de producción, proporciona {WHITE}al menos dos de los {BLACK}cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Para alcanzar la tasa máxima de producción, proporciona {WHITE}al menos tres de los {BLACK}cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}La producción es proporcional a la población del pueblo. Se producirán al menos {WHITE}{SIGNED_WORD} unidades{BLACK} y no más de {WHITE}{SIGNED_WORD} unidades{BLACK} de carga cada minuto."

[STR_PRIMARY_PRODUCTION_1X]
