[STR_PARAM_NAME_OBJECTS]
base = "CIRS-landskapsobjekter"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS inneholder et sett med landskapsobjekter som spillerne kan plassere for å få bestemte næringer til å se større ut. Landskapsobjekter har ingen innvirkning på spillopplevelsen. Landskapsobjekter kan slås på eller av."

