[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS – samfunnets industriutskiftingspakke"

[STR_GRF_DESC]
base = "{ORANGE}CIRS – samfunnets industriutskiftingspakke{}{BLACK}En fellesskapsvedlikeholdt forgrening av FIRS, opprinnelig utviklet av andythenorth, FooBar, planetmaker, Terkhen og Yexo, med hjelp fra mange andre. {SILVER}Se nettsiden for mer informasjon, inkludert hvordan du bruker CIRS. {BLACK}Lisens: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Største avstand for fiskebanker, oljeplattformer og mudderbanker fra kysten (i brikker)."

[STR_PARAM_DESC_ECONOMIES]
base = "Hver økonomi tilbyr en ulik kombinasjon av varer og industrier.{}{}For spillere som ønsker et enklere spill, har {SILVER}basis{BLACK}økonomiene færre industrier og varer enn andre økonomier.{}{}Nettstedet for CIRS har detaljert informasjon om hver enkelt økonomi."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Største avstand fra kysten for marine industrier (i brikker)."

[STR_PARAM_NAME_ECONOMIES]
base = "Økonomi"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Ingen begrensning"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Antall kasser utstyr for Forbedret primær produksjon (standard 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Antall kasser utstyr for Gung-ho primær produksjon (standard 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Gårder, gruver og lignende industrier vil øke produksjonen hvis det blir levert utstyr, først til {SILVER}Forbedret{BLACK}, deretter til {SILVER}Gung-ho{BLACK} hvis mange nok kasser blir levert.{}{}Forhåndsinnstillingene er gode, men kan om nødvendig endres her.{}{}Varebehov for havneindustrier vil være 8 ganger de verdiene som angis her."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Forbedret primært produksjonsnivå (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho primært produksjonsnivå (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produksjon ved gårder, gruver og lignende industrier når krav til utstyr er innfridd (som prosentandel av {SILVER}Normalt{BLACK} produksjonsnivå)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
