base = "{BLACK}Produserer maksimalt hvis {WHITE}hvilken som helst {BLACK}nødvendig vare leveres."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}For maksimal produksjonshastighet, lever {WHITE}begge {BLACK}nødvendige laster minst én gang hvert tredje minutt."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
