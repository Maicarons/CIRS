[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Cyflenwch {WHITE}o leiaf un {BLACK} o nwyddau gofynnol ar gyfer cynhyrchu uchaf."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Er mwyn cyfradd cynhyrchu uchaf, cyflenwch {WHITE}y ddau {BLACK}cargos sydd eu hangen o leiaf unwaith bob tri munud."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Er mwyn cael y gyfradd cynhyrchu uchaf, cyflenwch {WHITE}pob {BLACK}carg sydd ei angen o leiaf unwaith bob tri munud."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
