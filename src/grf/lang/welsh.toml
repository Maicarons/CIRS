[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Set Disodli Diwydiant Cymunedol CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Set Disodli Diwydiant Cymunedol CIRS{}{BLACK}Fforc a gynhelir gan y gymuned o FIRS, a grëwyd yn wreiddiol gan andythenorth, FooBar, planetmaker, Terkhen a Yexo, gyda help gan llawer eraill. {SILVER}Gweler y wefan am fwy o wybodaeth, gan gynnwys sut i ddefnyddio CIRS. {BLACK}Trwydded: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Pellter uchafsymol o'r arfordir ar gyfer meusydd pysgota, rigiau olew a mannau carthu fishing grounds, oil rigs and dredging sites, mewn teiliau."

[STR_PARAM_DESC_ECONOMIES]
base = "Mae pob economi yn darparu cyfuniad gwahanol o nwyddau a diwydiannau.{}{}I chwaraewyr sydd eisiau chwarae syml, mae gan economi {SILVER}Sylfaenol {BLACK}CIRS lai o ddiwydiannau a nwyddau na economi CIRS eraill.{}{}Mae gwefan CIRS yn darparu gwybodaeth fanwl am bob economi."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Pellter o'r arfordir ar gyfer diwydiannau morol (mewn teiliau)"

[STR_PARAM_NAME_ECONOMIES]
base = "Economi"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Dim terfyn"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Cristiau cyflenwi sydd eu hangen ar gyfer cynhyrchu cynradd Gwell (default 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Cristiau cyflenwi sydd eu hangen ar gyfer cynhyrchu cynradd Gung-ho (default 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Bydd ffermydd, mineau a diwydiannau tebyg yn cynyddu cynhyrchu pan fydd blwchau cyflenwad yn cael eu dosbarthu, yn gyntaf i {SILVER}Enhanced{BLACK}, ac yna i {SILVER}Gung-ho{BLACK}, os cyflwynir digon o blwchau.  {}{}Mae'r gwerthoedd diffiniol yn dda, ond os oes angen, gallwch eu newid yma.  {}{}Bydd gofynion cludo ar gyfer diwydiannau o fath porthladd yn 8x y gwerthoedd a osodir yma."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Lefel cynhyrchu cynradd gwella (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Lefel cynhyrchu cynradd Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Cynhyrchu ar ffermydd, mewn mines a diwydiannau tebyg pan gaiff gofynion cyflenwi eu bodloni (fel canran o lefel cynhyrchu {SILVER}Normal {BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Temperate Sylfaenol"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arctig Sylfaenol"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
