[STR_PARAM_NAME_OBJECTS]
base = "Wrthrychau tirwedd CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "Mae CIRS yn cynnwys set o wrthrychau tirwedd, y gall chwaraewyr eu gosod i wneud i ddiwydiannau penodol edrych yn fwy. Nid oes gan wrthrychau tirwedd unrhyw effaith ar y gêm. Gellir eu troi ymlaen neu allan wrthrychau tirwedd."

