[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Setul de înlocuire a industriilor comunitare CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Setul comunitar de înlocuire a industriilor CIRS{}{BLACK}O ramură întreținută de comunitate a FIRS, creată inițial de andythenorth, FooBar, planetmaker, Terkhen și Yexo, cu ajutorul multor alții. {SILVER}Consultați site-ul web pentru mai multe informații, inclusiv despre cum să utilizați CIRS. {BLACK}Licență: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distanţa maximă a zonelor de pescuit, a sondelor petroliere şi zonelor de dragare faţă de coastă."

[STR_PARAM_DESC_ECONOMIES]
base = "Fiecare economie oferă o combinație diferită de mărfuri și industrii.{}{}Pentru jucătorii care doresc un mod de joc simplu, economiile {SILVER}de bază {BLACK}conțin mai puține industrii și mărfuri decât alte economii CIRS.{}{}Site-ul web CIRS oferă informații detaliate despre fiecare economie."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distanţa maximă de coastă a industriilor marine"

[STR_PARAM_NAME_ECONOMIES]
base = "Economie"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Fără limită"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Lăzi de aprovizionare necesare pentru producția primară îmbunătățită (implicit 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Lăzi de aprovizionare necesare pentru producția primară Gung-ho (implicit 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Fermele, minele și industriile similare vor crește producția atunci când sunt livrate lăzi de aprovizionare, mai întâi către {SILVER}Enhanced{BLACK}, și apoi către {SILVER}Gung-ho{BLACK}, dacă sunt livrate suficiente lăzi.  {}{}Valorile implicite sunt bune, dar, dacă este necesar, le puteți modifica aici.  {}{}Cerințele de marfă pentru industriile de tip port vor fi de 8 ori mai mari decât valorile setate aici."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nivel îmbunătățit al producției primare (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nivelul de producție primară Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Producția la ferme, mine și industrii similare atunci când cerințele de aprovizionare sunt îndeplinite (ca procent din nivelul de producție {SILVER}normal {BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Temperat de bază"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arctic Basic"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropic Basic"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Într-o țară caldă"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Orașul oțelului"

[STR_PARAM_NAME_OBJECTS]
base = "Obiectele de amenajare a peisajului CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS include un set de obiecte de amenajare a peisajului, pe care jucătorii le pot plasa pentru a face anumite industrii să pară mai mari. Obiectele de peisaj nu au niciun efect asupra jocului. Acestea pot fi activate sau dezactivate."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opțional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(furnizat)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Furnizați {WHITE}cel puțin o {BLACK} marfă necesară pentru producție maximă."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Pentru o rată maximă de producție, furnizați {WHITE}ambele {BLACK}marfuri necesare cel puțin o dată la fiecare trei minute."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Pentru o rată maximă de producție, furnizați {WHITE}toate {BLACK}marfurile necesare cel puțin o dată la fiecare trei minute."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Pentru o rată maximă de producție, furnizați {WHITE}cel puțin două {BLACK}marfuri necesare cel puțin o dată la fiecare trei minute."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Pentru o rată maximă de producție, furnizați {WHITE}cel puțin trei {BLACK}marfuri necesare cel puțin o dată la fiecare trei minute."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
