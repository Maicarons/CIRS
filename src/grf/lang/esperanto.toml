[STR_PARAM_DESC_OBJECTS]
base = "CIRS inkluzivas arĝon de pejzaĝaj objektoj, kiujn ludantoj povas loki por igi certajn industriojn aspekti pli grandaj. Pejzaĝaj objektoj ne influas la ludadon. Pejzaĝaj objektoj povas esti ŝaltitaj aŭ malŝaltitaj."

