[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Komunuma Industria Anstataŭiga Arĝo de CIRS"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Komunuma Industria Anstataŭiga Aro{}{BLACK}Komunume prizorgata forko de FIRS, origine kreita de andythenorth, FooBar, planetmaker, Terkhen kaj Yexo, kun helpo de multaj aliaj. {SILVER}Vidu la retejon por pli da informoj, inkluzive de kiel uzi CIRS. {BLACK}Licenco: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimuma distanco de fiŝkaptejoj, oleplatformoj, kaj skrapejoj de la marbordo en kaheloj."

[STR_PARAM_DESC_ECONOMIES]
base = "Ĉiu ekonomio provizas malsaman kombinaĵon da ŝarĝoj kaj industrioj.{}{}Por ludantoj, kiuj volas simplan ludadon, la {SILVER}bazaj {BLACK}ekonomioj enhavas malpli da industrioj kaj ŝarĝoj ol aliaj CIRS-ekonomioj.{}{}La retejo de CIRS provizas detalajn informojn pri ĉiu ekonomio."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimuma marborda distanco de mara industrioj en kaheloj"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomio"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Ne limigo"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Necesaj provizkojtoj por plibonigita ĉefa produktado (defaŭlte 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Necesaj provizkojtoj por entuziasma ĉefa produktado (defaŭlte 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Fermjoj, minejoj kaj similaj industrioj pliigos sian produktadon kiam provizaj kestoj estos liveritaj, unue al {SILVER}Enhanced{BLACK}, kaj poste al {SILVER}Gung-ho{BLACK}, se sufiĉe da kestoj estos liveritaj.  {}{}La defaŭltaj valoroj estas bonaj, sed se necese, vi povas ŝanĝi ilin ĉi tie.  {}{}La varpostuloj por havenaj industrioj estos 8-oblo de la valoroj difinitaj ĉi tie."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Plibonigita nivelo de primara produktado (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho-nivelo de primara produktado (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
