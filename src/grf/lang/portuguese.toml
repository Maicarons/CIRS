[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Conjunto CIRS de Substituição de Indústrias da Comunidade"

[STR_GRF_DESC]
base = "{ORANGE}Conjunto CIRS de Substituição de Indústrias da Comunidade{}{BLACK}Um fork da FIRS mantido pela comunidade, originalmente por andythenorth, FooBar, planetmaker, Terkhen e Yexo, com a ajuda de muitos outros. {SILVER}Veja o site para mais informações, incluindo como usar o CIRS. {BLACK}Licença: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distância máxima de pesqueiros, plataformas de petróleo e dragagens a partir da costa, em quadrados."

[STR_PARAM_DESC_ECONOMIES]
base = "Cada economia fornece uma combinação diferente de cargas e indústrias.{}{}Para jogadores que querem uma jogabilidade simples, economias {SILVER}Básicas {BLACK}contêm menos indústrias e cargas do que outras economias do CIRS.{}{}O site do CIRS fornece informações detalhadas sobre cada economia."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distância costeira máxima das indústrias marítimas (em quadrados)"

[STR_PARAM_NAME_ECONOMIES]
base = "Economia"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sem limite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Caixas de suprimento exigidas para produção primária Aprimorada (padrão 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Caixas de suprimento exigidas para produção primária Entusiasta (padrão 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Fazendas, minas e indústrias similares aumentarão a produção quando caixas de suprimento forem entregues, primeiro para {SILVER}Aprimorada{BLACK}, e depois para {SILVER}Entusiasta{BLACK}, se forem entregues caixas suficientes.  {}{}Os valores padrão são bons, mas se precisar, pode alterá-los aqui.  {}{}Os requisitos de carga para indústrias portuárias serão 8x os valores definidos aqui."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nível de produção primária Aprimorada (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nível de produção primária Entusiasta (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produção em fazendas, minas e indústrias similares quando os requisitos de suprimento são atendidos (como porcentagem do nível de produção {SILVER}Normal{BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Básica Temperada"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Básica Ártica"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Básica Tropical"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Num País Quente"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Oeste Ameno e Brando"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Cidade Siderúrgica"

[STR_PARAM_NAME_OBJECTS]
base = "Objetos de paisagismo do CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "O CIRS inclui um conjunto de objetos de paisagismo, que os jogadores podem colocar para fazer certas indústrias parecerem maiores. Objetos de paisagismo não têm efeito na jogabilidade. Objetos de paisagismo podem ser ativados ou desativados."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opcional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(fornecido)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Forneça {WHITE}ao menos uma {BLACK}carga exigida para produção máxima."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Para taxa de produção máxima, forneça {WHITE}ambas {BLACK}cargas exigidas pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Para taxa de produção máxima, forneça {WHITE}todas {BLACK}cargas exigidas pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Para taxa de produção máxima, forneça {WHITE}pelo menos duas {BLACK}cargas exigidas pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Para taxa de produção máxima, forneça {WHITE}pelo menos três {BLACK}cargas exigidas pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}A produção é proporcional à população da cidade. Pelo menos {WHITE}{SIGNED_WORD} unidades{BLACK} e não mais que {WHITE}{SIGNED_WORD} unidades{BLACK} de carga serão produzidas por minuto."

