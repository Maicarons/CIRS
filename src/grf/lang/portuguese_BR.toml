[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Conjunto de Substituição de Indústrias Comunitárias CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Conjunto de Substituição de Indústrias Comunitárias CIRS{}{BLACK}Um fork do FIRS mantido pela comunidade, originalmente criado por andythenorth, FooBar, planetmaker, Terkhen e Yexo, com a ajuda de muitas outras pessoas. {SILVER}Consulte o site para obter mais informações, incluindo como usar o CIRS. {BLACK}Licença: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "A distância máxima da costa de zonas de pesca, plataformas de petróleo e campos de dragagem em blocos."

[STR_PARAM_DESC_ECONOMIES]
base = "Cada economia oferece uma combinação diferente de cargas e indústrias.{}{}Para jogadores que desejam uma jogabilidade simples, as economias {SILVER}Básicas {BLACK}contêm menos indústrias e cargas do que outras economias do CIRS.{}{}O site do CIRS fornece informações detalhadas sobre cada economia."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distância máxima costeira das indústrias marinhas em blocos"

[STR_PARAM_NAME_ECONOMIES]
base = "Economia"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sem limite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Caixas de suprimentos necessárias para a produção primária aprimorada (padrão: 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Caixas de suprimentos necessárias para a produção primária Gung-ho (padrão: 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Fazendas, minas e indústrias similares aumentarão a produção quando as caixas de suprimentos forem entregues, primeiro para {SILVER}Aprimorado{BLACK} e, em seguida, para {SILVER}Gung-ho{BLACK}, se caixas suficientes forem entregues.  {}{}Os valores padrão são bons, mas, se necessário, você pode alterá-los aqui.  {}{}Os requisitos de carga para indústrias do tipo porto serão 8x os valores definidos aqui."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nível aprimorado de produção primária (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nível de produção primária Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produção em fazendas, minas e indústrias similares quando os requisitos de suprimento são atendidos (como porcentagem do nível de produção {SILVER}Normal {BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Economia Básica Clima Temperado"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Economia Básica Clima Ártico"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Economia Básica Clima Tropical"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Coração das Trevas"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Cidade do aço"

[STR_PARAM_NAME_OBJECTS]
base = "Objetos de paisagismo do CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "O CIRS inclui um conjunto de objetos de paisagismo que os jogadores podem colocar para fazer certas indústrias parecerem maiores. Os objetos de paisagismo não têm efeito na jogabilidade. Eles podem ser ativados ou desativados."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opcional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(fornecido)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Forneça {WHITE}pelo menos um {BLACK} cargo necessário para obter a produção máxima."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Para obter a taxa máxima de produção, forneça {WHITE}ambos os {BLACK}cargos necessários pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Para obter a taxa máxima de produção, forneça {WHITE}todos os {BLACK}cargos necessários pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Para obter a taxa máxima de produção, forneça {WHITE}pelo menos dois {BLACK}cargos necessários pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Para obter a taxa máxima de produção, forneça {WHITE}pelo menos três {BLACK}cargos necessários pelo menos uma vez a cada três minutos."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}A produção é proporcional à população da cidade. Pelo menos {WHITE}{SIGNED_WORD} unidades{BLACK} e no máximo {WHITE}{SIGNED_WORD} unidades{BLACK} de carga serão produzidas a cada minuto."

[STR_PRIMARY_PRODUCTION_1X]
