[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Conxunto de substitución industrial comunitaria de CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Conxunto de substitución industrial comunitaria de CIRS{}{BLACK}Unha bifurcación de FIRS mantida pola comunidade, creada orixinalmente por andythenorth, FooBar, planetmaker, Terkhen e Yexo, coa axuda de moitas outras persoas. {SILVER}Consulta o sitio web para obter máis información, incluído como usar CIRS. {BLACK}Licenza: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distancia máxima de caladoiros, plataformas petrolíferas e dragados dende a costa, en cadrados."

[STR_PARAM_DESC_ECONOMIES]
base = "Cada economía ofrece unha combinación diferente de cargas e industrias.{}{}Para os xogadores que desexan unha xogabilidade sinxela, as economías {SILVER}Básicas {BLACK}contén menos industrias e cargas que outras economías CIRS.{}{}O sitio web de CIRS ofrece información detallada sobre cada economía."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distancia máxima de industrias marítimas, en cadrados."

[STR_PARAM_NAME_ECONOMIES]
base = "Economía"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sen límite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Caixas de abastecemento precisas para a produción primaria mellorada (16 por defecto)."

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Caixas de abastecemento para a produción primaria ao límite (80 por defecto)."

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "As granxas, minas e industrias similares aumentarán a produción ao recibir caixas de abastecemento, primeiro a nivel {SILVER}mellorado{BLACK}, e logo {SILVER}ao límite{BLACK}. {}{}. Os valores por defecto están ben, pero, se precisas, podes modificalos aquí. {}{} Os requirimentos de carga para industrias portuarias serán 8 veces superiores aos establecidos por este parámetro."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nivel de produción primaria mellorada (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nivel de produción primaria ao límite(%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produción nas granxas, minas e industrias similares cando se cumpren os requirimentos de abastecemento (amosado como porcentaxe do nivel de produción {SILVER}normal{BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Temperada básica"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Ártica básica"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropical básica"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Nun país cálido"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Cidade Siderúrxica"

[STR_PARAM_NAME_OBJECTS]
base = "Obxectos de paisaxismo de CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS inclúe un conxunto de obxectos de paisaxismo que os xogadores poden colocar para facer que determinadas industrias parezan máis grandes. Os obxectos de paisaxe non teñen ningún efecto na xogabilidade. Estes obxectos poden activarse ou desactivarse."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opcional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(incluído)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Produce ao máximo se se fornece{WHITE} calquera {BLACK} carga requirida."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Para obter a taxa de produción máxima, fornece {WHITE}ambos {BLACK}os cargamentos necesarios polo menos unha vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Para obter a taxa de produción máxima, fornece {WHITE}todos {BLACK}os cargamentos necesarios polo menos unha vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Para obter a taxa de produción máxima, fornece {WHITE}polo menos dous {BLACK}cargamentos necesarios polo menos unha vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Para obter a taxa de produción máxima, fornece {WHITE}polo menos tres {BLACK}cargamentos necesarios polo menos unha vez cada tres minutos."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}A produción é proporcional á poboación da vila. Produciranse polo menos {WHITE}{SIGNED_WORD} unidades{BLACK} e non máis de {WHITE}{SIGNED_WORD} unidades{BLACK} de carga cada minuto."

[STR_PRIMARY_PRODUCTION_1X]
base = "{BLACK}Produción actual: {YELLOW}normal {}{}{BLACK}Para produción {WHITE}mellorada {BLACK} entrega {SIGNED_WORD} caixas de abastecemento nun trimestre.{}Para produción {WHITE}ao límite{BLACK} entrega {SIGNED_WORD} caixas."

[STR_PRIMARY_PRODUCTION_2X]
base = "{BLACK}Produción actual: {YELLOW}mellorada {}{}{BLACK}Para manter este nivel, entrega {SIGNED_WORD} caixas de abastecemento nun trimestre.{}Para produción {WHITE}ao límite {BLACK} entrega {SIGNED_WORD} caixas."

[STR_PRIMARY_PRODUCTION_4X]
base = "{BLACK}Produción actual: {YELLOW}ao límite {}{}{BLACK}Para manter este nivel, entrega {SKIP}{SIGNED_WORD} caixas de mercadorías nun trimestre."

[STR_PORT_PRODUCTION_1X]
base = "{BLACK}Produción actual: {YELLOW}normal {}{}{BLACK}Para produción {WHITE}mellorada {BLACK} entrega {SIGNED_WORD} unidades de cargas requiridas nun trimestre.{}Para produción {WHITE}ao límite {BLACK} entrega {SIGNED_WORD} unidades."

[STR_PORT_PRODUCTION_2X]
base = "{BLACK}Produción actual: {YELLOW}mellorada {}{}{BLACK}Para manter este nivel, entrega {SIGNED_WORD} unidades de cargas requeridas nun trimestre.{}Para produción {WHITE}ao límite {BLACK} entrega {SIGNED_WORD} unidades."

