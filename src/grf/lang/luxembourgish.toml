[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS Community-Industrie-Ersatzset"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community-Industrie-Ersatzset{}{BLACK}Eng vun der Communautéit gewartete Fork vu FIRS, ursprénglech vun andythenorth, FooBar, planetmaker, Terkhen an Yexo entwéckelt, mat Hëllef vu villeenen aneren. {SILVER}Kuckt d'Website fir méi Informatiounen, dorënner wéi een CIRS benotzt. {BLACK}Lizenz: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximalen Ofstand vun Fëschgrënn, Buerinselen an Baggerweiheren vun der Küst a Felder ausgedréckt."

[STR_PARAM_DESC_ECONOMIES]
base = "All Wiertschaftstyp stellt verschidden Industrien a Frachtarten bereed.{}{}De Wiertschaftstyp {SILVER}Einfach {BLACK}bidd manner Industrien a Frachtarten un, wéi déi aner Wiertschaftstypen.{}{}Op der CIRS Websäit kann een weider Informatiounen iwwer déi verschidden Wiertschaftstypen noliesen."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximalen Ofstand vun Séindustrien vun der Küst a Felder ausgedréckt"

[STR_PARAM_NAME_ECONOMIES]
base = "Wiertschaftstyp"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Ouni Limite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Këschten déi fir erweidert Produktioun gebraucht ginn (Standard 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Këschten déi fir extrem Produktioun gebraucht ginn (Standard 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Baurenhäff, Minen an ähnlech Industrien wäerten hier Produktioun verbesseren, als éischt op {SILVER}Erweidert{BLACK}, an dann op {SILVER}Extrem{BLACK}, wa genuch Këschte geliwwert ginn.{}{}D'Standardwäerter si gutt, mee falls néideg, kënnen se geännert ginn.{}{}Wuerewäerter fir Industrien vum Typ \"Hafen\", sinn 8x déi hei agestallte Wäerter."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Erweiderte Primärproduktiounsniveau (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Extreme Primärproduktiounsniveau (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produktioun op Häff, Minnen an ähnlëchen Industrien déi d'Beliwwerungsbedéngungen erfëllen  (als Prozentsaz vum Produktiounswert {SILVER}Normal {BLACK})."

