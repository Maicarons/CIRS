[STR_PARAM_DESC_OBJECTS]
base = "CIRS enthält e Set vu Landschaftsobjekter, déi d'Spiller placéiere kënnen, fir bestëmmte Branchen méi grouss ausgesinn ze loossen. D'Landschaftsobjekter hunn kee Spillwierkung. D'Landschaftsobjekter kënnen ageschalt oder ausgeschalt ginn."

