base = "விவசாய நிலங்கள், சுரங்கங்கள் மற்றும் அதற்கு ஒத்த தொழில்களில், வழங்கல் தேவைகள் நிறைவு செய்யப்பட்டபோது உள்ள உற்பத்தி ({SILVER}சாதாரண {BLACK}உற்பத்தி நிலவரத்தின் சதவீதமாக)."

