base = "CIRS சமூகத் தொழில் மாற்றுத் தொகுப்பு"

[STR_GRF_DESC]
base = "{ORANGE}CIRS சமூகத் தொழில் மாற்றுத் தொகுப்பு{}{BLACK}FIRS-இன் சமூகம் பராமரிக்கும் ஃபோர்க் இது; இதை முதலில் andythenorth, FooBar, planetmaker, Terkhen மற்றும் Yexo ஆகியோர், பலரின் உதவியுடன் உருவாக்கினர். {SILVER}CIRS-ஐ எவ்வாறு பயன்படுத்துவது என்பது உட்பட கூடுதல் தகவல்களுக்கு இணையதளத்தைப் பாருங்கள். {BLACK}உரிமம்: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "டைல்களில் கடற்கரையிலிருந்து மீன்பிடிக் களங்கள், எண்ணெய் தளங்கள் மற்றும் அகழ்வுத் தளங்களுக்கான அதிகபட்சத் தொலைவு."

[STR_PARAM_DESC_ECONOMIES]
base = "ஒவ்வொரு பொருளாதாரமும் சரக்குகள் மற்றும் தொழில்களின் வெவ்வேறு சேர்க்கையை வழங்குகிறது.{}{}எளிய விளையாட்டு அனுபவத்தை விரும்பும் வீரர்களுக்கு, {SILVER}Basic {BLACK}பொருளாதாரங்களில் மற்ற CIRS பொருளாதாரங்களைவிடக் குறைவான தொழில்களும் சரக்குகளும் உள்ளன.{}{}ஒவ்வொரு பொருளாதாரம் பற்றிய விரிவான தகவல்கள் CIRS இணையதளத்தில் கிடைக்கின்றன."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
