[STR_PARAM_DESC_OBJECTS]
base = "CIRS-இல் நிலப்பரப்பு அமைப்புப் பொருட்களின் தொகுப்பு ஒன்று உள்ளது; வீரர்கள் அவற்றை வைத்து சில தொழில்கள் பெரிதாகத் தெரியுமாறு செய்யலாம். நிலப்பரப்புப் பொருட்கள் விளையாட்டு நடவடிக்கையில் எந்த விளைவையும் ஏற்படுத்தாது. அவற்றை இயக்கவோ நிறுத்தவோ முடியும்."

