[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Gung-ho முதன்மை உற்பத்திக்குத் தேவையான பொருள் பெட்டிகள் (இயல்பாக 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "போதுமான குடிசைகள் வழங்கப்பட்டால், விவசாய நிலங்கள், சுரங்கங்கள் மற்றும் இதேபோன்ற தொழில்கள் வழங்கல் குடிசைகள் வந்தவுடன் உற்பத்தியை அதிகரிக்கும்; முதலில் {SILVER}Enhanced{BLACK}-க்கும், பின்னர் {SILVER}Gung-ho{BLACK}-க்கும் அது வழங்கப்படும்.  {}{}இயல்புநிலை மதிப்புகள் நல்லவையே; ஆனால் தேவைப்பட்டால், அவற்றை இங்கே மாற்றலாம்.  {}{}துறைமுக வகைத் தொழில்களுக்கான சரக்குத் தேவைகள் இங்கே அமைக்கப்பட்ட மதிப்புகளின் 8 மடங்காக இருக்கும்."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
