[STR_PARAM_DESC_OBJECTS]
base = "CIRS obsahuje súbor objektov terénneho úpravy, ktoré môžu hráči umiestňovať, aby sa určité odvetvia zdali väčšie. Objekty terénnej úpravy nemajú žiadny vplyv na hrateľnosť. Objekty terénnej úpravy možno zapínať a vypínať."

