base = "Kompletná sada nahradenia priemyslu CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Kompletná sada nahradenia priemyslu CIRS{}{BLACK}Komunitou udržiavaná odnož FIRS, pôvodne vytvorená používateľmi andythenorth, FooBar, planetmaker, Terkhen a Yexo, s pomocou mnohých ďalších. {SILVER}Viac informácií vrátane návodu na používanie CIRS nájdete na webovej stránke. {BLACK}Licencia: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximálna vzdialenosť lovísk rýb, ropných plošín a bagrovísk od pobrežia v dielcoch."

[STR_PARAM_DESC_ECONOMIES]
base = "Každá ekonomika poskytuje inú kombináciu nákladov a odvetví.{}{}Pre hráčov, ktorí chcú jednoduché hranie, obsahujú {SILVER}základné {BLACK}ekonomiky menej odvetví a nákladov než ostatné ekonomiky CIRS.{}{}Webová stránka CIRS poskytuje podrobné informácie o každej ekonomike."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximálna pobrežná vzdialenosť morského priemyslu v dielcoch"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomika"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Bez limitu"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Počet surovín požadovacných pre zvýšenú produkciu (štandardne 16ks)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Krabice so zásobami potrebné na primárnu výrobu Gung-ho (predvolene 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Farmy, bane a podobné odvetvia zvýšia výrobu po doručení dodávkových debien, najprv na {SILVER}Enhanced{BLACK} a potom na {SILVER}Gung-ho{BLACK}, ak bude doručených dostatok debien.  {}{}Predvolené hodnoty sú vhodné, ale ak je to potrebné, môžete ich tu zmeniť.  {}{}Požiadavky na náklad pre odvetvia prístavného typu budú 8-násobkom hodnôt nastavených tu."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Zvýšená úroveň primárnej produkcie (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Hlavná úroveň produkcie Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Výroba v poľnohospodárskych podnikoch, v baniach a podobných odvetviach, iba ak sú splnené požiadavky na dodávku. (Ako percento {SILVER}normálnej {BLACK}produkčnej úrovne.)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
