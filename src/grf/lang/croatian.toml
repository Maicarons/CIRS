[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Kompletni skup zamjene industrija za zajednicu CIRS"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Zajednički komplet za zamjenu industrije{}{BLACK}Zajednički održavana forka FIRS-a, izvorno izrađena od strane andythenortha, FooBara, planetmakera, Terkhena i Yexoa, uz pomoć mnogih drugih. {SILVER}Za više informacija, uključujući upute za korištenje CIRS-a, pogledajte web-stranicu. {BLACK}Licenca: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Najveća udaljenost ribarskih polja, naftnih platformi i jaružališta od obale u poljima."

[STR_PARAM_DESC_ECONOMIES]
base = "Svaka ekonomija daje različite kombinacije tereta i industrija.{}{}Za igrače koji žele jednostavnost igre, {SILVER}Osnovne {BLACK} ekonomije imaju manje industrija i tereta nego druge CIRS ekonomije.{}{}Na CIRS web stranici se nalaze detaljne informacije o svakoj vrsti ekonomije."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Najveća udaljenost od obale za pomorske industrije u poljima"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomija"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Bez limita"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Kutije potrepština potrebne za Unaprijeđenu primarnu proizvodnju (osnovna postavka 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Kutije potrepština potrebne za Masovnu primarnu proizvodnju (osnovna postavka 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Farme, rudnici i slične industrije će povećati proizvodnju kada su kutije potrepština dostavljene, prvo na {SILVER}Unaprijeđenu{BLACK}, a onda na {SILVER}Masovnu{BLACK} proizvodnju, ako je dostavljeno dovoljno kutija.{}{}Osnovne postavke su dovoljno dobre ali ako trebate, možete ih promijeniti ovdje.{}{}Potrebe dostave tereta za industrije u lukama će biti 8x veće od vrijednosti postavljenih ovdje."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nivo Unaprijeđene primarne proizvodnje (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nivo Masovne primarne proizvodnje (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Proizvodnja na farmama, u rudnicima i sličnim industrijama kada su potrebe dostave zadovoljene (kao postotak {SILVER}Normalnog {BLACK} nivoa proizvodnje)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Osnovna - umjerena klima"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
