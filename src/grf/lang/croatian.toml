[STR_PARAM_NAME_OBJECTS]
base = "Predmeti CIRS-a za uređenje krajolika"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS uključuje skup predmeta za uređenje krajolika koje igrači mogu postaviti kako bi određene industrije izgledale veće. Predmeti za uređenje krajolika nemaju nikakav utjecaj na igranje. Oni se mogu uključiti ili isključiti."

