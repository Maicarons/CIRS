[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS Community-Industri-Ersatzpakke"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community Industry Replacement Set{}{BLACK}En fællesskabsvedligeholdt forgrening af FIRS, oprindeligt udviklet af andythenorth, FooBar, planetmaker, Terkhen og Yexo, med hjælp fra mange andre. {SILVER}Se websiden for mere information, herunder hvordan CIRS bruges. {BLACK}Licens: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimal afstand mellem fiskeområder, boreplatforme og uddybningssteder og kysten i felter."

[STR_PARAM_DESC_ECONOMIES]
base = "Hver økonomi tilbyder en anden kombination af laster og industrier.{}{}For spillere, der ønsker en enkel spiloplevelse, indeholder {SILVER}grundlæggende {BLACK}økonomier færre industrier og laster end andre CIRS-økonomier.{}{}CIRS' hjemmeside indeholder detaljerede oplysninger om hver økonomi."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimal afstand mellem kysten og marine industrier, i felter"

[STR_PARAM_NAME_ECONOMIES]
base = "Økonomi"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Ingen begrænsning"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Antal forsyningskasser, der kræves til forbedret primærproduktion (standard 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Antal forsyningskasser, der kræves til Gung-ho-primærproduktion (standard 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Landbrug, miner og lignende industrier vil øge produktionen, når forsyningskasser leveres, først til {SILVER}Forbedret{BLACK}, og derefter til {SILVER}Gung-ho{BLACK}, hvis der leveres tilstrækkeligt mange kasser.  {}{}Standardværdierne er gode, men hvis du har brug for det, kan du ændre dem her.  {}{}Lastkravene til havnetyper af industrier vil være 8 gange de værdier, der er angivet her."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Forbedret niveau for primærproduktion (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho primærproduktionsniveau (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produktion på landbrug, miner og lignende industrier, når forsyningskravene er opfyldt (som procentdel af {SILVER}normalt {BLACK}produktionsniveau)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Tempereret basis"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Subarktisk basis"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Subtropisk basis"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Heart of Darkness"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Stålby"

[STR_PARAM_NAME_OBJECTS]
base = "CIRS' landskabsobjekter"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS indeholder et sæt landskabsobjekter, som spillerne kan placere for at få visse industrier til at se større ud. Landskabsobjekter har ingen indvirkning på spillet. Landskabsobjekter kan slås til eller fra."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(valgfrit)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(medfølgende)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Lever {WHITE}mindst én {BLACK} påkrævet fragttype for maksimal produktion."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}For maksimal produktionshastighed, lever {WHITE}begge {BLACK}nødvendige laster mindst én gang hver tredje minut."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}For maksimal produktionshastighed skal alle {WHITE}påkrævede {BLACK}fragttyper leveres mindst én gang hver tredje minut."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}For maksimal produktionshastighed, lever {WHITE}mindst to {BLACK}nødvendige laster mindst én gang hver tredje minut."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}For maksimal produktionshastighed, lever {WHITE}mindst tre {BLACK}nødvendige laster mindst én gang hver tredje minut."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}Produktionen er proportional med byens befolkning. Der vil blive produceret mindst {WHITE}{SIGNED_WORD} enheder{BLACK} og højst {WHITE}{SIGNED_WORD} enheder{BLACK} fragt hvert minut."

[STR_PRIMARY_PRODUCTION_1X]
base = "{BLACK}Nuværende produktion: {YELLOW}Normal {}{}{BLACK}For {WHITE}Forbedret {BLACK}produktion skal der leveres {SIGNED_WORD} kasser med forsyninger mindst én gang hver tredje minut.{}For {WHITE}Gung-ho {BLACK}-produktion skal der leveres {SIGNED_WORD} kasser."

[STR_PRIMARY_PRODUCTION_2X]
base = "{BLACK}Nuværende produktion: {YELLOW}Forbedret {}{}{BLACK}For at opretholde dette niveau skal du levere {SIGNED_WORD} kasser med forsyninger mindst én gang hver tredje minut.{}For {WHITE}Gung-ho {BLACK}-produktion skal du levere {SIGNED_WORD} kasser."

[STR_PRIMARY_PRODUCTION_4X]
base = "{BLACK}Nuværrende produktion: {YELLOW}Gung ho (firedobbelt){}{}{BLACK}For at fastholde dette niveau, aflever {SKIP}{SIGNED_WORD} kasser materialer inden tre måneder"

[STR_PORT_PRODUCTION_1X]
base = "{BLACK}Nuværende produktion: {YELLOW}Normal {}{}{BLACK}For {WHITE}Forbedret {BLACK}produktion skal der leveres {SIGNED_WORD} enheder fragt mindst én gang hver tredje minut.{}For {WHITE}Gung-ho {BLACK}-produktion skal der leveres {SIGNED_WORD} enheder."

[STR_PORT_PRODUCTION_2X]
base = "{BLACK}Nuværende produktion: {YELLOW}Forbedret {}{}{BLACK}For at opretholde dette niveau skal du levere {SIGNED_WORD} enheder last mindst én gang hver tredje minut.{}For {WHITE}Gung-ho {BLACK}-produktion skal du levere {SIGNED_WORD} enheder."

[STR_PORT_PRODUCTION_4X]
base = "{BLACK}Nuværrende produktion: {YELLOW}Gung ho (firedobbelt){}{}{BLACK}For at fastholde dette niveau, aflever {SKIP}{SIGNED_WORD} enheder af fragt inden tre måneder"

