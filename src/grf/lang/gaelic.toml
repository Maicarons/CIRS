[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Baile Stàilinn"

[STR_PARAM_NAME_OBJECTS]
base = "Nithean cruthachadh-tìre CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "Tha seata de nithean cruthachadh-tìre ann an CIRS, as urrainn do chluicheadairean an cur an sàs gus cuid de dh’ionnstradaidhean a dhèanamh coltach gu bheil iad nas motha. Chan eil buaidh cluiche sam bith aig nithean cruthachadh-tìre. Faodar nithean cruthachadh-tìre a chur air no dheth."

