[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Seata Cuir-rèiteachaidh Gnìomhachas Coimhearsnachd CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Seata Cur-a-steach Gnìomhachais Coimhearsnachd CIRS{}{BLACK}Forca de FIRS a tha air a chumail suas leis a’ choimhearsnachd, air a chruthachadh an toiseach le andythenorth, FooBar, planetmaker, Terkhen agus Yexo, le cuideachadh bho mhòran eile. {SILVER}Faic an làrach-lìn airson barrachd fiosrachaidh, a’ gabhail a-steach mar a chleachdas tu CIRS. {BLACK}Cead: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "An t-astar as motha bho chòsta gu raointean iasgaich, turraingean ola agus làraichean drèididh, ann an tilsean."

[STR_PARAM_DESC_ECONOMIES]
base = "Tha cothlamadh eadar-dhealaichte de luchd-giùlain agus gnìomhachasan aig gach eaconamaidh.{}{}Do chluicheadairean a tha ag iarraidh cluich sìmplidh, tha nas lugha de ghnìomhachasan agus luchd-giùlain ann an eaconamaidhean {SILVER}Bunasach {BLACK}CIRS na tha ann an eaconamaidhean CIRS eile.{}{}Tha an làrach-lìn CIRS a’ toirt seachad mion-fhiosrachadh mu gach eaconamaidh."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "An t-astar còsta as motha airson gnìomhachasan mara ann an tilsean"

[STR_PARAM_NAME_ECONOMIES]
base = "Eaconamaidh"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Gun chuingeachadh"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Bogsaichean solarachaidh a dh’fheumar airson prìomh chinneasachadh Leasaichte (16 mar bhun-roghainn)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Bogsaichean solarachaidh a dh’fheumar airson prìomh chinneasachadh Gung-ho (80 mar bhun-roghainn)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Nì fearannan-tuathanais, mèinnean agus gnìomhachasan coltach ris barrachd cinneasachaidh nuair a thèid bogsaichean solar a lìbhrigeadh, an toiseach gu {SILVER}Enhanced{BLACK}, agus an uair sin gu {SILVER}Gung-ho{BLACK}, ma thèid gu leòr bogsaichean a lìbhrigeadh.  {}{}Tha na luachan bhunasach math, ach ma dh’fheumas tu, faodaidh tu an atharrachadh an seo.  {}{}Bidh feumalachdan luchd-giùlain airson gnìomhachasan de sheòrsa puirt 8x na luachan a chaidh a shuidheachadh an seo."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Ìre àrdachaidh prìomh chinneasachaidh (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Ìre prìomh-chruthachaidh Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Gnìomhachas air feirmean, ann an mèinnean agus ann an gnìomhachasan coltach riutha nuair a thathar air coinneachadh ri feumalachdan solar (mar cheudad de ìre cinneasachd {SILVER}àbhaisteach {BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Bun-ìre Mheadhanach"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
