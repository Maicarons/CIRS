[STR_GRF_DESC]
base = "{ORANGE}Zestaw zastępczy dla społeczności przemysłowej CIRS{}{BLACK}Wspólnotowo utrzymywany fork projektu FIRS, pierwotnie stworzony przez andythenorth, FooBar, planetmaker, Terkhen i Yexo, przy wsparciu wielu innych osób. {SILVER}Zobacz stronę internetową, aby uzyskać więcej informacji, w tym o tym, jak korzystać z CIRS. {BLACK}Licencja: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksymalna odległość od linii brzegowej dla łowisk, platform wiertniczych i pogłębiarek."

[STR_PARAM_DESC_ECONOMIES]
base = "Każda z dostępnych w CIRS ekonomii oferuje inną kombinację towarów i fabryk.{}{}Dla graczy preferujących proste zasady gry zalecany jest wybór ekonomii {SILVER}Zwykła. {BLACK}Zawiera ona mniej fabryk i towarów niż inne ekonomie CIRS.{}{}Strona internetowa CIRS zawiera szczegółowe informacje na temat każdej z ekonomii."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksymalny dystans przedsiębiorstw morskich od wybrzeża"

[STR_PARAM_NAME_ECONOMIES]
