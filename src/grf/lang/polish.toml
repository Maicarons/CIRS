[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Surowce potrzebne dla zwiększonej produkcji (domyślnie 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Surowce potrzebne dla niewiarygodnej produkcji (domyślnie 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Gospodarstwa, kopalnie i podobne zakłady zwiększą produkcję, kiedy surowce są dostarczane, najpierw do {SILVER}zwiększonej{BLACK}, a później do {SILVER}niewiarygodnej{BLACK}.{}{}Domyślne wartości są dobre, ale jeśli chcesz, to możesz zmienić je tutaj.{}{}Wymagania dotyczące ilości dostarczanych surowców dla portów będą 8-krotnością wartości tu ustalonej."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
