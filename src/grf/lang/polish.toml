[STR_GRF_NAME]
base = "CIRS Community Industry Replacement Set"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community Industry Replacement Set{}{BLACK}Fork projektu FIRS rozwijany przez społeczność, autorzy FIRS: andythenorth, FooBar, planetmaker, Terkhen, Yexo i inni. {SILVER}Więcej informacji w pliku readme. {BLACK}Licencja: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksymalna odległość od linii brzegowej dla łowisk, platform wiertniczych i pogłębiarek."

[STR_PARAM_DESC_ECONOMIES]
base = "Każda z dostępnych w CIRS ekonomii oferuje inną kombinację towarów i fabryk.{}{}Dla graczy preferujących proste zasady gry zalecany jest wybór ekonomii {SILVER}Zwykła. {BLACK}Zawiera ona mniej fabryk i towarów niż inne ekonomie CIRS.{}{}Strona internetowa CIRS zawiera szczegółowe informacje na temat każdej z ekonomii."

[STR_PARAM_DESC_NO_OPENINGS]
base = "Domyślnie nowe przedsiębiorstwa powstają w trakcie gry.{}{}Jeśli parametr {SILVER}zapobiegaj powstawaniu przedsiębiorstw {BLACK}jest włączony to zakłady nie będą otwierane, a gracz nie będzie miał możliwości ich fundowania."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksymalny dystans przedsiębiorstw morskich od wybrzeża"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomia"

[STR_PARAM_NAME_NO_OPENINGS]
base = "Zapobiegaj powstawaniu przedsiębiorstw"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "bez limitu"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Surowce potrzebne dla zwiększonej produkcji (domyślnie 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Surowce potrzebne dla niewiarygodnej produkcji (domyślnie 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Gospodarstwa, kopalnie i podobne zakłady zwiększą produkcję, kiedy surowce są dostarczane, najpierw do {SILVER}zwiększonej{BLACK}, a później do {SILVER}niewiarygodnej{BLACK}.{}{}Domyślne wartości są dobre, ale jeśli chcesz, to możesz zmienić je tutaj.{}{}Wymagania dotyczące ilości dostarczanych surowców dla portów będą 8-krotnością wartości tu ustalonej."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Zwiększony poziom produkcji (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Niewiarygodny poziom produkcji (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produkcja w gospodarstwach, kopalniach i podobnych zakładach kiedy wymagania dotyczące dostaw są spełnione (jako procent {SILVER}normalnego {BLACK}poziomu produkcji)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
