[STR_PARAM_DESC_OBJECTS]
base = "CIRS zawiera zestaw obiektów, które gracz może umieścić, aby wizualnie zwiększyć wybrane przedsiębiorstwa. Obiekty te nie mają wpływu na rozgrywkę. Mogą być one włączone lub wyłączone."

