[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS Community-Industri-Ersättningspaket"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community Industry Replacement Set{}{BLACK}En community-underhållen fork av FIRS, ursprungligen skapad av andythenorth, FooBar, planetmaker, Terkhen och Yexo, med hjälp från många andra. {SILVER}Se webbplatsen för mer information, inklusive hur man använder CIRS. {BLACK}Licens: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximalt avstånd mellan fångstområden, oljeriggar och mudderverk, och kusten, i antal rutor."

[STR_PARAM_DESC_ECONOMIES]
base = "Varje ekonomi har egen kombination av godstyper och industrier.{}{}För spelare som vill ha en mer okomplicerad spelupplevelse innehåller {SILVER}bas{BLACK}-ekonomierna färre industrier och godstyper än andra CIRS-ekonomier.{}{}Detaljerad information om varje ekonomityp finns på CIRS hemsida."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximalt avstånd mellan kusten och marina industrier, i antal rutor"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomi"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Ingen begränsning"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Antal lådor som krävs för förhöjd primär produktion (standard är 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Antal lådor som krävs för Gung-ho primär produktion (standard är 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "När lådor med materiel levereras till bondgårdar, gruvor och liknande industrier, kommer produktionen först att ändras till {SILVER}Förhöjd (dubbel){BLACK} och sedan till {SILVER}Gung-ho{BLACK} ifall det levereras tillräckligt med lådor.{}{}Standardvärdet är bra men du kan ändra det här ifall behov skulle uppstå.{}{}Behovet av antal lådor som fraktas till hamnliknande industrier kommer att bli 8x högre och det värdet kan ändras här."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Förhöjd primär produktionsnivå (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho primär produktionsnivå (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produktion på bondgårdar, gruvor och liknande industrier när leveranskraven är uppnådda (i procent av {SILVER}Normal {BLACK} produktionsnivå)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Tempererad bas-ekonomi"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arktisk bas-ekonomi"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropisk bas-ekonomi"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "I ett varmare land"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Stålstaden"

[STR_PARAM_NAME_OBJECTS]
base = "CIRS landskapsobjekt"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS inkluderar en uppsättning landskapsobjekt som spelare kan placera för att få vissa industrier att se större ut. Landskapsobjekt har ingen effekt på spelandet. Landskapsobjekt kan slås på eller av."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(valfritt)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = "{BLACK}(mottagen)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Producerar maximalt när {WHITE}någon {BLACK} erforderlig last levereras."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}För maximal produktionshastighet, leverera {WHITE}båda de {BLACK}krävda lasterna minst en gång var tredje minut."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}För maximal produktionshastighet, leverera {WHITE}alla {BLACK}krävda laster minst en gång var tredje minut."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}För maximal produktionshastighet, leverera {WHITE}minst två {BLACK}krävda laster minst en gång var tredje minut."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
