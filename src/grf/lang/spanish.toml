[STR_PORT_PRODUCTION_1X]
base = "{BLACK}Producción actual: {YELLOW}Normal {}{}{BLACK}Para producción {WHITE}Mejorada{BLACK} entrega {SIGNED_WORD} unidades de mercancía al menos una vez cada tres minutos.{}Para producción {WHITE}Entusiasta{BLACK} entrega {SIGNED_WORD} unidades."

[STR_PORT_PRODUCTION_2X]
base = "{BLACK}Producción actual: {YELLOW}Mejorado {}{}{BLACK}Para mantener este nivel, entrega {SIGNED_WORD} unidades de mercancía al menos una vez cada tres minutos.{}Para producción {WHITE}Entusiasta{BLACK} entrega {SIGNED_WORD} unidades."

