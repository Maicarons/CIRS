[GLOBAL_PRAGMA]
grflangid = "0x04"
plural = "0"

[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS - Conjunto de Reemplazo de Industria Comunitaria"

[STR_GRF_DESC]
base = "{ORANGE}CIRS - Conjunto de Reemplazo de Industria Comunitaria{}{BLACK}Una bifurcación mantenida por la comunidad de FIRS, originalmente de andythenorth, FooBar, planetmaker, Terkhen y Yexo, con ayuda de muchos otros. {SILVER}Consulta el sitio web para más información, incluido cómo usar CIRS. {BLACK}Licencia: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distancia máxima de los caladeros, plataformas petrolíferas y zonas de dragado desde la costa en casillas."

[STR_PARAM_DESC_ECONOMIES]
base = "Cada economía ofrece una combinación diferente de mercancías e industrias.{}{}Para los jugadores que quieren una jugabilidad simple, las economías {SILVER}Básicas{BLACK} contienen menos industrias y mercancías que otras economías de CIRS.{}{}El sitio web de CIRS proporciona información detallada sobre cada economía."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distancia costera máxima de las industrias marinas en casillas"

[STR_PARAM_NAME_ECONOMIES]
base = "Economía"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sin límite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Cajas de suministro requeridas para producción primaria mejorada (predeterminado 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Cajas de suministro requeridas para producción primaria entusiasta (predeterminado 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Granjas, minas e industrias similares aumentarán la producción cuando se entreguen cajas de suministro, primero a {SILVER}Mejorado{BLACK} y luego a {SILVER}Entusiasta{BLACK}, si se entregan suficientes cajas.  {}{}Los valores predeterminados son buenos, pero si necesitas, puedes cambiarlos aquí.  {}{}Los requisitos de mercancía para las industrias portuarias serán 8x los valores fijados aquí."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nivel de producción primaria mejorado (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nivel de producción primaria entusiasta (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Producción en granjas, minas e industrias similares cuando se cumplen los requisitos de suministro (como porcentaje del nivel de producción {SILVER}Normal{BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Templado (Básico)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Ártico (Básico)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropical (Básico)"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "En un país caliente"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Ciudad del acero"

[STR_PARAM_NAME_OBJECTS]
base = "Objetos de paisajismo de CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS incluye un conjunto de objetos de paisajismo que los jugadores pueden colocar para hacer que ciertas industrias parezcan más grandes. Estos objetos no tienen efecto en el juego. Se pueden activar o desactivar."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opcional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(incluido)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Este es un texto de GS. {WHITE}Haz clic en mí para la página de historia de la ciudad. {BLACK}Aquí hay más texto."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Para la tasa máxima de producción, suministra {WHITE}ambos{BLACK} cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Para la tasa máxima de producción, suministra {WHITE}todos{BLACK} los cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Para la tasa máxima de producción, suministra {WHITE}al menos dos{BLACK} cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Para la tasa máxima de producción, suministra {WHITE}al menos tres{BLACK} cargos requeridos al menos una vez cada tres minutos."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}La producción es proporcional a la población de la ciudad. Al menos {WHITE}{SIGNED_WORD} unidades{BLACK} y no más de {WHITE}{SIGNED_WORD} unidades{BLACK} de mercancía se producirán cada minuto."

[STR_PRIMARY_PRODUCTION_1X]
base = "{BLACK}Producción actual: {YELLOW}Normal {}{}{BLACK}Para producción {WHITE}Mejorada{BLACK} entrega {SIGNED_WORD} cajas de suministros al menos una vez cada tres minutos.{}Para producción {WHITE}Entusiasta{BLACK} entrega {SIGNED_WORD} cajas."

[STR_PRIMARY_PRODUCTION_2X]
