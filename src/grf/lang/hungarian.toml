[STR_GRF_DESC]
base = "{ORANGE}CIRS Közösségi Ipari Pótlócsomag{}{BLACK}A FIRS közösség által karbantartott ága, amelyet eredetileg andythenorth, FooBar, planetmaker, Terkhen és Yexo készített, számos más személy segítségével. {SILVER}További információért, köztük a CIRS használatának módjáról is, lásd a weboldalt. {BLACK}Licenc: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "A halászterületek, olajfúró tornyok és mederkotrások maximális távolsága a parttól."

[STR_PARAM_DESC_ECONOMIES]
base = "Az egyes gazdaságokban különféle rakományok és gazdasági épületek érhetőek el.{}{}Az egyszerűbb játékmenet érdekében az {SILVER}alap {BLACK}gazdaságok kevesebb rakományt és gazdasági épületet tartalmaznak, mint a többi CIRS gazdaság.{}{}A CIRS weboldalán részletes leírás található mindegyik gazdaságról."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Tengeri gazdasági létesítmények maximális távolsága a parttól"

[STR_PARAM_NAME_ECONOMIES]
