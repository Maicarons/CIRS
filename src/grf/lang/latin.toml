[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Urbs chalybis"

[STR_PARAM_NAME_OBJECTS]
base = "Obiecta ornatus terrae CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS complectitur collectionem obiectorum ornatus terrae, quae lusores collocare possunt ut quaedam industriae maioribus videantur. Obiecta ornatus terrae nullum effectum in ludu habent. Ea in usum aut ex usu poni possunt."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
