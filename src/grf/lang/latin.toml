[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS Complementum Industrialium Communium Substitutionis"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Complementum Industrialium Communium Substitutionis{}{BLACK}Ramus FIRS a communitate curatus, initio ab andythenorth, FooBar, planetmaker, Terkhen et Yexo creatus, plurimorum aliorum auxilio. {SILVER}Plura cognoscere, inter quae etiam quomodo CIRS adhibendum sit, in situ interretiali vide. {BLACK}Licentia: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Numerus tegularum maximus a littore ad zonas piscarias, suggestus petrolearios, et situs effosionis struendos."

[STR_PARAM_DESC_ECONOMIES]
base = "Oeconomiae produnt varia onera et variae industriae.{}{}Ei qui vult ludum simplicem habere debet eligere oeconomiam {SILVER}simplicem{BLACK}, nam habent pauciores industrias oneraque quam aliae oeconomiae.{}{}Situs Interretialis CIRS habet plures descriptiones oeconomiarum."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Numerus tegularum maximus a littore ad industrias marinas struendas"

[STR_PARAM_NAME_ECONOMIES]
base = "Oeconomia"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Infinitus"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Quot capsae necessariae sunt ad productionem augendam (16 est solitus)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Quot capsae necessariae sunt ad productionem maxime augendam (80 est solitus)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Productio fundorum, fodinarum, et ceterarum industriarum augetur dum necessarii apparatus traditi sunt, primum {SILVER}aucta{BLACK}, demum {SILVER}maxima{BLACK}, satis apparatibus traditis.{}{}Valores soliti sat boni sunt, sed si vis, potes eos mutare.{}{}Portus et industriae similes postulant octuplicem quantitatem."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Productio aucta (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Productio maxima (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Productio fundorum, fodinarum, et ceterarum, dum apparatus necessarii traditi sunt (% productionis {SILVER}mediocris{BLACK})"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Temperata Simplex"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arctica Simplex"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
