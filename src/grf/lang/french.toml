[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS - Ensemble d’industries communautaires de remplacement"

[STR_GRF_DESC]
base = "{ORANGE}CIRS - Ensemble d’industries communautaires de remplacement{}{BLACK}Fork maintenu par la communauté de FIRS, à l’origine par andythenorth, FooBar, planetmaker, Terkhen et Yexo, avec l’aide de nombreux autres. {SILVER}Consultez le site web pour plus d’informations, y compris comment utiliser CIRS. {BLACK}Licence : GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Éloignement côtier maximal des zones de pêche, plates-formes pétrolières et sites de dragage."

[STR_PARAM_DESC_ECONOMIES]
base = "Chaque modèle économique présente des industries et des cargaisons différentes.{}{}Pour les joueurs intéressés par un jeu plus simple, les économies {SILVER}\"Basiques\"{BLACK} contiennent moins d'industries et de cargaisons que les autres économies \"CIRS\".{}{}Le site web de CIRS procure des informations détaillées sur chaque modèle économique."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Éloignement côtier maximal des industries maritimes (en nombre de cases)"

[STR_PARAM_NAME_ECONOMIES]
base = "Économie"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Pas de limite"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Caisses d’approvisionnement requises pour la production primaire renforcée (par défaut 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Caisses d’approvisionnement requises pour la production primaire entreprenante (par défaut 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Les fermes, mines et industries similaires augmenteront leur production lorsque des caisses d’approvisionnement sont livrées, d’abord jusqu’à {SILVER}Renforcée{BLACK}, puis jusqu’à {SILVER}Entreprenante{BLACK}, si suffisamment de caisses sont livrées.  {}{}Les valeurs par défaut sont bonnes, mais vous pouvez les modifier ici si besoin.  {}{}Les besoins en cargaisons pour les industries portuaires seront 8x les valeurs définies ici."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Niveau de production primaire renforcée (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Niveau de production primaire entreprenante (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Production des fermes, mines et industries similaires, quand les besoins en matières premières sont satisfaits (% du niveau {SILVER}Normal{BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Basique - Environnement tempéré"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Basique - Environnement arctique"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Basique - Environnement tropical"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Dans un pays chaud"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Ouest modéré"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Cité de l'acier"

[STR_PARAM_NAME_OBJECTS]
base = "Objets d’aménagement paysager CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS comprend un ensemble d’objets d’aménagement paysager que les joueurs peuvent placer pour agrandir certaines industries. Ces objets n’ont aucun effet sur le jeu. Ils peuvent être activés ou désactivés."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(facultatif)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = "{BLACK}(livré)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Production maximale quand {WHITE}n'importe quelle {BLACK}marchandise nécessaire est livrée."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Pour un taux de production maximal, fournissez {WHITE}les deux {BLACK}marchandises requises au moins une fois toutes les trois minutes."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Pour un taux de production maximal, fournissez {WHITE}toutes {BLACK}les marchandises requises au moins une fois toutes les trois minutes."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
