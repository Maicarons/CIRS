[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Pour un taux de production maximal, fournissez {WHITE}au moins trois {BLACK}marchandises requises au moins une fois toutes les trois minutes."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}La production est proportionnelle à la population de la ville. Au moins {WHITE}{SIGNED_WORD} unités{BLACK} et pas plus de {WHITE}{SIGNED_WORD} unités{BLACK} de marchandises seront produites chaque minute."

