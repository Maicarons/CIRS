[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS Topluluk Sanayi Değiştirme Seti"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Topluluk Endüstri Değiştirme Seti{}{BLACK}FIRS'in topluluk tarafından sürdürülen bir çatallanmasıdır; orijinal olarak andythenorth, FooBar, planetmaker, Terkhen ve Yexo tarafından, diğer birçok kişinin de yardımıyla oluşturulmuştur. {SILVER}CIRS'in nasıl kullanılacağı da dahil olmak üzere daha fazla bilgi için web sitesine bakın. {BLACK}Lisans: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Balıkçılık alanlarının, petrol platformlarının ve tarama sahalarının kıyıdan maksimum mesafesi (kare cinsinden)."

[STR_PARAM_DESC_ECONOMIES]
base = "Her ekonomi, farklı bir kargo ve sanayi kombinasyonu sunar.{}{}Basit bir oyun deneyimi isteyen oyuncular için, {SILVER}Temel {BLACK}ekonomiler diğer CIRS ekonomilerine göre daha az sanayi ve kargo içerir.{}{}CIRS web sitesi her ekonomi hakkında ayrıntılı bilgi sunar."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Deniz endüstrilerinin maksimum kıyı mesafesi (karo cinsinden)"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomi"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sınır yok"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Geliştirilmiş birincil üretim için gerekli tedarik sandıkları (varsayılan 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Gung-ho birincil üretim için gerekli tedarik sandıkları (varsayılan 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Yeterli koli teslim edilirse, çiftlikler, madenler ve benzeri endüstriler önce {SILVER}Geliştirilmiş{BLACK}, ardından da {SILVER}Gung-ho{BLACK} olduğunda üretimlerini artıracaktır.  {}{}Varsayılan değerler iyidir, ancak gerekirse bunları burada değiştirebilirsiniz.  {}{}Liman tipi endüstriler için kargo gereksinimleri, burada ayarlanan değerlerin 8 katı olacaktır."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Geliştirilmiş birincil üretim seviyesi (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho birincil üretim seviyesi (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Tedarik gereksinimleri karşılandığında çiftliklerde, madenlerde ve benzeri sanayilerdeki üretim ({SILVER}Normal {BLACK}üretim seviyesinin yüzdesi olarak)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Basit Ilıman"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
