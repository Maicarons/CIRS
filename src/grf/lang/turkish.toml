[STR_PARAM_NAME_OBJECTS]
base = "CIRS peyzaj nesneleri"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS, oyuncuların belirli sanayileri daha büyük göstermek için yerleştirebileceği bir dizi peyzaj nesnesi içerir. Peyzaj nesnelerinin oyun mekanikleri üzerinde hiçbir etkisi yoktur. Peyzaj nesneleri açılıp kapatılabilir."

