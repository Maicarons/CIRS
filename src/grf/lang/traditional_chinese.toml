[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS 社區產業替換套組"

[STR_GRF_DESC]
base = "{ORANGE}CIRS 社區產業替換套組{}{BLACK}一個由社區維護的 FIRS 分支，最初由 andythenorth、FooBar、planetmaker、Terkhen 和 Yexo 開發，並得到許多其他人的協助。{SILVER}請參閱網站以取得更多資訊，包括如何使用 CIRS。{BLACK}授權：GPL v2。"

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "漁場、鑽井平台、疏浚區距離海岸的最大距離。"

[STR_PARAM_DESC_ECONOMIES]
base = "每種經濟模式對應不同的貨物和工業組合。{}{}希望簡單遊戲的休閑玩家可以選擇{SILVER}基礎{BLACK}模式，其所提供的貨物與工業種類比其他CIRS經濟模式所提供的為少。{}{}CIRS網站提供各經濟模式的詳盡信息。"

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "海洋產業距離海岸的最大距離。"

[STR_PARAM_NAME_ECONOMIES]
base = "經濟"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "無限制"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "改進基礎生產所需的物資（預設16）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "「工合」基礎生產所需的物資（預設80）"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "農場、礦場與類似工業於滿足需求時會先至{SILVER}改進{BLACK}再達致{SILVER}「工合」{BLACK}，並獲相應生產水平。{}{}預設數字已經適合，然而你依然可於此更改。{}{}出口型工業為本值的8倍。"

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "改進基礎生產水平（%）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "「工合」基礎生產水平（%）"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "農場、礦場與類似工業於滿足需求時之生產（相對於{SILVER}正常{BLACK}生產水平） 。"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
