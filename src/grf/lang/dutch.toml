[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS Community-Industrie-Ersatzset"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community-Industrie-Ersatzset{}{BLACK}Een door de community onderhouden fork van FIRS, oorspronkelijk gemaakt door andythenorth, FooBar, planetmaker, Terkhen en Yexo, met hulp van vele anderen. {SILVER}Zie de website voor meer informatie, inclusief hoe je CIRS kunt gebruiken. {BLACK}Licentie: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximale afstand tot de kust in tegels voor visgebieden en baggermolens."

[STR_PARAM_DESC_ECONOMIES]
base = "Elke economie heeft een andere combinatie van goederen en industrieën.{}{}Voor spelers die een eenvoudig spelverloop willen zijn er {SILVER}basis{BLACK} economieën die minder industrieën en goederen bevatten.{}{}De CIRS website (Engelstalig) geeft gedetailleerde informatie over elke economie."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximale afstand tot de kust in tegels voor zee-industrieën"

[STR_PARAM_NAME_ECONOMIES]
base = "Economie"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Geen limiet"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Aantal benodigde kratten voor verhoogde productie (standaard 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Aantal benodigde kratten voor gepassioneerde productie (standaard 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Boerderijen, mijnen en soortgelijke industrieën verhogen naar {SILVER}verhoogd{BLACK} productieniveau als er kratten goederen worden afgeleverd. Bij voldoende leveringen wordt het prudctieniveau gewijzigd naar {SILVER}gepassioneerd{BLACK}.{}{}De standaard waardes zijn goed werkbaar, maar indien nodig kunnen ze hier veranderd worden.{}{}Goedereneisen van havens-achtige industrieën zijn 8 keer zo hoog als de getallen die hier opgegeven worden."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Productieniveau van verhoogde productie (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Productieniveau van gepassioneerde productie (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Productie van boerderijen, mijnen en soortgelijke industrieën bij het vervullen van de bevoorradingseisen (als percentage van {SILVER}normale{BLACK} productie)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Basiseconomie voor het gematigde klimaat"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Basiseconomie voor het subarctisch klimaat"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Basiseconomie voor het subtropisch klimaat"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "In een heet land"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Staalstad"

[STR_PARAM_NAME_OBJECTS]
base = "CIRS-landschapsobjecten"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS bevat een set landschapsobjecten die spelers kunnen plaatsen om bepaalde industrieën groter te laten lijken. Landschapsobjecten hebben geen effect op de gameplay. Landschapsobjecten kunnen worden ingeschakeld of uitgeschakeld."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(optioneel)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = "{BLACK}(geleverd)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK} Produceert op maximaal niveau als {WHITE}een van de {BLACK} benodigde goederen wordt geleverd."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Voor een maximale productiesnelheid, levert u {WHITE}beide {BLACK}vereiste ladingen minstens één keer elke drie minuten aan."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Voor een maximale productiesnelheid, levert u {WHITE}alle {BLACK}vereiste ladingen minstens één keer elke drie minuten aan."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Voor een maximale productiesnelheid, levert u {WHITE}minstens twee {BLACK}vereiste ladingen minstens één keer elke drie minuten aan."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Voor een maximale productiesnelheid, levert u {WHITE}minstens drie {BLACK}vereiste ladingen minstens één keer elke drie minuten aan."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}De productie is evenredig met de bevolking van de stad. Er wordt elke minuut minstens {WHITE}{SIGNED_WORD} eenheden{BLACK} en niet meer dan {WHITE}{SIGNED_WORD} eenheden{BLACK} aan lading geproduceerd."

