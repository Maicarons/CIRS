[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Toimita laatikoita vaadittuna tehostettuun alkutuotantoon (oletus 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Tarvikelaatikoita vaaditaan lietsottuun alkutuotantoon (oletusarvo 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Maatilat, kaivokset, ja vastaavat teollisuudet lisäävät tuotantoa kun tarvikelaatikoita  toimitetaan, ensin {SILVER}Tehostetuksi{BLACK}, ja sitten {SILVER}Lietsotuksi{BLACK}, jos tarvikelaatikoita toimitetaan tarpeeksi.{}{}Esiasetellut arvot ovat hyviä, mutta jos haluat, voit vaihtaa niitä tässä.{}{}Rahtivaatimukset satama-tyyppisille teollisuuksille ovat  8x täällä asetettuihin arvoihin nähden."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
