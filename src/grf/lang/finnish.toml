[STR_PARAM_DESC_OBJECTS]
base = "CIRS sisältää joukon maisemointiesineitä, joita pelaajat voivat sijoittaa saadakseen tietyt teollisuudet näyttämään suuremmilta. Maisemointiesineillä ei ole vaikutusta pelin kulkuun. Maisemointiesineet voidaan ottaa käyttöön tai poistaa käytöstä."

