base = "CIRS-yhteisöteollisuuden korvaussetti"

[STR_GRF_DESC]
base = "{ORANGE}CIRS-yhteisöteollisuuden korvaussetti{}{BLACK}Yhteisön ylläpitämä FIRS-haara, jonka ovat alun perin kehittäneet andythenorth, FooBar, planetmaker, Terkhen ja Yexo monien muiden avustuksella. {SILVER}Katso verkkosivusto saadaksesi lisätietoja, myös siitä, miten CIRS:ää käytetään. {BLACK}Lisenssi: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Kalastus- ja ruoppausalueiden sekä öljylauttojen etäisyys rannasta ruutuina."

[STR_PARAM_DESC_ECONOMIES]
base = "Jokainen talousvaihtoehto mahdollistaa erilaisen yhdistelmän rahteja ja teollisuuksia.{}{}Yksinkertaisesta pelityylistä pitävien kannattaa kokeilla {SILVER}pelkistettyjä {BLACK}talouksia, joissa on vähemmän teollisuustyyppejä ja rahteja verrattuna muihin CIRS:in talouksiin.{}{}CIRS:in kotisivu antaa tarkempaa tietoa erilaisista talouksista."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Meriteollisuuden vähimmäismatka rantaan, ruutuina"

[STR_PARAM_NAME_ECONOMIES]
base = "Talous"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
