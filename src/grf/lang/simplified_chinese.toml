[STR_GRF_NAME]
base = "CIRS 社区产业替换集"

[STR_GRF_DESC]
base = "{ORANGE}CIRS 社区产业替换集{}{BLACK}这是 FIRS 的社区维护分支，原版 FIRS 由 andythenorth、FooBar、planetmaker、Terkhen 和 Yexo 创作，并得到许多其他人的帮助。{SILVER}请访问网站获取更多信息，包括如何使用 CIRS。{BLACK}许可证：GPL v2。"

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "渔场、石油钻井平台和疏浚区距离海岸的最大距离（以格为单位）。"

[STR_PARAM_DESC_ECONOMIES]
base = "每种经济模式都提供不同的货物与产业组合。{}{}对于想要简单玩法的玩家，{SILVER}基础{BLACK}经济模式所含的产业和货物比其他 CIRS 经济模式更少。{}{}CIRS 网站提供了每种经济模式的详细信息。"

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "海洋产业距离海岸的最大距离（格）"

[STR_PARAM_NAME_ECONOMIES]
base = "经济模式"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "无限制"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "提升初级产业产量至“增强”所需的供应箱数量（默认 16）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "提升初级产业产量至“工合”所需的供应箱数量（默认 80）"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "农场、矿场和类似产业在收到供应箱后会提高产量：如果送达的箱子足够多，产量会先提升到 {SILVER}增强{BLACK}，然后再提升到 {SILVER}工合{BLACK}。  {}{}默认值已经很好，但如有需要，你可以在这里修改。  {}{}港口类产业的货物需求量将是这里设定值的 8 倍。"

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "“增强”初级产业产量水平（%）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "“工合”初级产业产量水平（%）"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "当供应需求得到满足时，农场、矿场和类似产业的产量（以 {SILVER}正常 {BLACK}产量水平的百分比表示）。"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "温带基础"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "寒带基础"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
