[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Set Pengganti Industri Komunitas CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Set Pengganti Industri Komunitas CIRS{}{BLACK}Sebuah cabang FIRS yang dikelola komunitas, yang awalnya dibuat oleh andythenorth, FooBar, planetmaker, Terkhen, dan Yexo, dengan bantuan dari banyak pihak lainnya. {SILVER}Lihat situs web untuk informasi lebih lanjut, termasuk cara menggunakan CIRS. {BLACK}Lisensi: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Jarak maksimal untuk area tangkapan ikan, anjungan lepas pantai dan pengerukan pasir laut dari pantai dalam petak."

[STR_PARAM_DESC_ECONOMIES]
base = "Setiap ekonomi menyediakan kombinasi kargo dan industri yang berbeda.{}{}Bagi pemain yang menginginkan gameplay sederhana, ekonomi {SILVER}Dasar {BLACK}memiliki lebih sedikit industri dan kargo dibandingkan ekonomi CIRS lainnya.{}{}Situs web CIRS menyediakan informasi terperinci tentang setiap ekonomi."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Jarak terjauh untuk industri lepas pantai dari garis pantai dalam blok area"

[STR_PARAM_NAME_ECONOMIES]
base = "Sistem Ekonomi"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Tak Terbatas"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Kotak pasokan yang diperlukan untuk produksi primer Enhanced (standar 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Kotak pasokan yang diperlukan untuk produksi primer Gung-ho (standar 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Peternakan, tambang, dan industri serupa akan meningkatkan produksi saat kotak pasokan dikirimkan, pertama ke {SILVER}Enhanced{BLACK}, lalu ke {SILVER}Gung-ho{BLACK}, jika kotak yang dikirimkan cukup.  {}{}Nilai bawaannya sudah baik, tetapi jika perlu, Anda dapat mengubahnya di sini.  {}{}Persyaratan kargo untuk industri tipe pelabuhan akan menjadi 8 kali nilai yang diatur di sini."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Tingkat produksi primer yang ditingkatkan (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Tingkat produksi primer Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produksi di pertanian, tambang, dan industri serupa ketika persyaratan pasokan terpenuhi (sebagai persentase dari tingkat produksi {SILVER}Normal {BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Sedang (Iklim) Dasar"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arktik Dasar"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropis Dasar"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Hati Kegelapan"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Steeltown"

[STR_PARAM_NAME_OBJECTS]
base = "Objek penataan lanskap CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS mencakup satu set objek penataan lanskap yang dapat ditempatkan oleh pemain agar industri tertentu terlihat lebih besar. Objek lanskap tidak memiliki efek pada gameplay. Objek penataan lanskap dapat diaktifkan atau dinonaktifkan."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opsional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(disertakan)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Sediakan {WHITE}setidaknya satu {BLACK} kargo yang diperlukan untuk produksi maksimal."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Untuk laju produksi maksimal, sediakan {WHITE}kedua {BLACK}kargo yang diperlukan setidaknya sekali setiap tiga menit."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Untuk tingkat produksi maksimal, pasokkan {WHITE}semua {BLACK}kargo yang diperlukan setidaknya sekali setiap tiga menit."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Untuk laju produksi maksimal, sediakan {WHITE}setidaknya dua {BLACK}kargo yang diperlukan setidaknya sekali setiap tiga menit."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
