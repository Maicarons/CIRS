[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Nahradní sada komunitního průmyslu CIRS"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community Industry Replacement Set{}{BLACK}Komunitou udržovaná vidlička FIRS, původně vytvořená andythenorth, FooBar, planetmaker, Terkhen a Yexo s pomocí mnoha dalších. {SILVER}Další informace, včetně návodu na používání CIRS, najdete na webu. {BLACK}Licence: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximální vzdálenost loviště ryb a těžby podvodních sedimentů od pobřeží."

[STR_PARAM_DESC_ECONOMIES]
base = "Každá ekonomie nabízí odlišnou kombinaci nákladů a odvětví.{}{}Pro hráče, kteří chtějí jednoduché hraní, obsahují {SILVER}základní {BLACK}ekonomie méně odvětví a nákladů než ostatní ekonomie CIRS.{}{}Webová stránka CIRS poskytuje podrobné informace o každé ekonomii."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximální vzdálenost vodního průmyslu"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomika"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Bez limitu"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Krabic zásob potřebných pro Zvýšenou primární produkci (výchozí 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Krabic zásob potřebných pro Gung-ho primární produkci (výchozí 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Produkce farem, dolů a podobného průmyslu se zvýší v případě dodání krabic se zásobami. Nejprve na {SILVER}Zvýšenou{BLACK}, a poté na {SILVER}Gung-ho{BLACK}, produkci, pokud je doručen dostatek zásob.{}{}Výchozí nastavení jsou dobrá, ale v případě potřeby je zde možné tyto hodnoty změnit.{}{}Požadavky na náklad jsou u přístavních typů průmyslu jsou znásobeny 8x."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Vylepšená základní úroveň produkce (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho primární úroveň produkce (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
