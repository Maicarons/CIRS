[STR_PARAM_NAME_OBJECTS]
base = "Objekty úpravy terénu CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS obsahuje sadu objektů pro úpravu terénu, které hráči mohou umístit, aby určité průmyslové objekty vypadaly větší. Objekty terénu nemají žádný vliv na hratelnost. Objekty úpravy terénu lze zapínat a vypínat."

