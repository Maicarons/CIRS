[GLOBAL_PRAGMA]
grflangid = "0x39"
plural = "1"

[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS コミュニティ産業置換セット"

[STR_GRF_DESC]
base = "{ORANGE}CIRS コミュニティ産業代替セット{}{BLACK}FIRSのコミュニティによるフォークで、元々は andythenorth、FooBar、planetmaker、Terkhen、Yexoによって作成され、多くの人々の協力も得ています。{SILVER}CIRSの使い方など、詳細はウェブサイトをご覧ください。{BLACK}ライセンス: GPL v2。"

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "タイル単位での漁場、石油リグ、浚渫地点から海岸までの最大距離。"

[STR_PARAM_DESC_ECONOMIES]
base = "各経済圏は、異なる貨物と産業の組み合わせを提供します。{}{}シンプルなゲームプレイを希望するプレイヤー向けに、{SILVER}Basic {BLACK}経済圏には、他のCIRS経済圏よりも少ない産業と貨物が含まれています。{}{}CIRSのウェブサイトでは、各経済圏に関する詳細な情報が提供されています。"

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "タイル単位での海洋産業の最大沿岸距離"

[STR_PARAM_NAME_ECONOMIES]
base = "経済圏"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "制限なし"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "強化一次生産に必要な供給箱（デフォルト16）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "ガンホー一次生産に必要な供給箱（デフォルト80）"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "農場、鉱山、および類似産業は、補給箱が届けられると生産量が増加します。まず {SILVER}Enhanced{BLACK} に、十分な箱が届けられれば次に {SILVER}Gung-ho{BLACK} に届けられます。 {}{}デフォルト値は適切ですが、必要であればここで変更できます。 {}{}港湾型産業の貨物要件は、ここに設定された値の8倍になります。"

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "一次生産レベルの向上（%）"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho 一次生産レベル (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "供給要件が満たされた場合の農場、鉱山、および類似産業での生産（{SILVER}通常 {BLACK}生産レベルに対する割合）。"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "温帯基本"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "北極ベーシック"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "トロピック・ベーシック"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "暑い国で"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "マイルド・マイルド・ウェスト"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "製鉄町"

[STR_PARAM_NAME_OBJECTS]
base = "CIRS 景観オブジェクト"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS には景観オブジェクトのセットが含まれており、プレイヤーはこれを配置して特定の産業をより大きく見せることができます。景観オブジェクトにはゲームプレイ上の効果はありません。景観オブジェクトはオン・オフの切り替えが可能です。"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(オプション)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(付属)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}最大生産量にするには、必要な貨物を{WHITE}少なくとも1種類{BLACK}供給してください。"

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}最大生産率にするには、必要な貨物を{WHITE}両方{BLACK}、3分ごとに少なくとも1回供給してください。"

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}最大生産率にするには、必要な貨物を{WHITE}すべて{BLACK}、3分ごとに少なくとも1回供給してください。"

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}最大生産率にするには、必要な貨物を{WHITE}少なくとも2種類{BLACK}、3分ごとに少なくとも1回供給してください。"

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}最大生産率にするには、必要な貨物を{WHITE}少なくとも3種類{BLACK}、3分ごとに少なくとも1回供給してください。"

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}生産量は町の人口に比例します。毎分、貨物は最低で{WHITE}{SIGNED_WORD}ユニット、{BLACK}最大で{WHITE}{SIGNED_WORD}ユニット{BLACK}生産されます。"

[STR_PRIMARY_PRODUCTION_1X]
base = "{BLACK}現在の生産量: {YELLOW}通常 {}{}{BLACK}{WHITE}強化 {BLACK}生産の場合は、3分に少なくとも1回、{SIGNED_WORD}箱の補給品を輸送してください。{}{WHITE}ガンホー {BLACK}生産の場合は、{SIGNED_WORD}箱を輸送してください。"

[STR_PRIMARY_PRODUCTION_2X]
