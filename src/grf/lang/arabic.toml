[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "صناديق التوريد المطلوبة للإنتاج الأولي المحسّن (الافتراضي 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "صناديق التوريد المطلوبة للإنتاج الأولي الحماسي (الافتراضي 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "ستزيد المزارع والمناجم والصناعات المماثلة إنتاجها عند تسليم صناديق الإمداد، أولاً إلى {SILVER}Enhanced{BLACK}، ثم إلى {SILVER}Gung-ho{BLACK}، إذا تم تسليم عدد كافٍ من الصناديق. {}{}القيم الافتراضية جيدة، ولكن إذا احتجت إلى ذلك، يمكنك تغييرها هنا. {}{}ستكون متطلبات الشحن للصناعات من نوع الموانئ 8 أضعاف القيم المحددة هنا."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
