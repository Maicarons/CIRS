[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "مجموعة استبدال الصناعة المجتمعية لـ CIRS"

[STR_GRF_DESC]
base = "{ORANGE}مجموعة CIRS البديلة للصناعات المجتمعية{}{BLACK}نسخة معدلة من FIRS يديرها المجتمع، أنشأها في الأصل andythenorth وFooBar وplanetmaker وTerkhen وYexo، بمساعدة الكثيرين غيرهم. {SILVER}راجع الموقع الإلكتروني لمزيد من المعلومات، بما في ذلك كيفية استخدام CIRS. {BLACK}الترخيص: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "أقصى مسافة لمناطق الصيد ومنصات النفط ومواقع التجريف عن الساحل بالبلاطات."

[STR_PARAM_DESC_ECONOMIES]
base = "توفر كل اقتصاد مزيجًا مختلفًا من البضائع والصناعات.{}{}بالنسبة للاعبين الذين يرغبون في تجربة لعب بسيطة، تحتوي اقتصادات {SILVER}الأساسية {BLACK}على صناعات وبضائع أقل من اقتصادات CIRS الأخرى.{}{}يوفر موقع CIRS الإلكتروني معلومات مفصلة عن كل اقتصاد."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "أقصى مسافة ساحلية للصناعات البحرية بالبلاطات"

[STR_PARAM_NAME_ECONOMIES]
base = "الاقتصاد"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
