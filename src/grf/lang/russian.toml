[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Набор CIRS для замены объектов промышленности в сообществе"

[STR_GRF_DESC]
base = "{ORANGE}Набор CIRS для замены объектов промышленности в сообществе{}{BLACK}Общественно поддерживаемая вилка FIRS, первоначально созданная andythenorth, FooBar, planetmaker, Terkhen и Yexo при помощи многих других. {SILVER}См. веб-сайт для получения дополнительной информации, в том числе о том, как использовать CIRS. {BLACK}Лицензия: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Максимальная удалённость местоположения рыболовных промыслов, нефтянных вышек и участков углубления дна от побережья в клетках."

[STR_PARAM_DESC_ECONOMIES]
base = "Каждая экономика предлагает разное сочетание грузов и отраслей.{}{}Для игроков, предпочитающих простой игровой процесс, {SILVER}базовые {BLACK}экономики содержат меньше отраслей и грузов, чем другие экономики CIRS.{}{}На сайте CIRS представлена подробная информация о каждой экономике."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Макс. удалённость предприятий на море от побережья в клетках"

[STR_PARAM_NAME_ECONOMIES]
base = "Экономика"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "без ограничений"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Ящики с припасами, необходимые для улучшенного первичного производства (по умолчанию 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Ящики с припасами, необходимые для первичного производства по методу Gung-ho (по умолчанию 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Фермы, шахты и подобные отрасли увеличат производство после доставки ящиков с ресурсами: сначала до {SILVER}Улучшенного{BLACK}, а затем до {SILVER}Гун-хо{BLACK}, если будет доставлено достаточно ящиков.  {}{}Значения по умолчанию подходят, но при необходимости их можно изменить здесь.  {}{}Требования к грузам для портовых отраслей будут в 8 раз выше значений, установленных здесь."

