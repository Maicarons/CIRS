[STR_PARAM_NAME_OBJECTS]
base = "CIRS-i maastikuelemendid"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS sisaldab maastikuelementide komplekti, mida mängijad saavad paigutada, et teatavad tööstusharud näeksid suuremad välja. Maastikuelementidel puudub mängumõju. Maastikuelemendid saab sisse või välja lülitada."

