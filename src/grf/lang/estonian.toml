[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS-i kogukonna tööstuse asendussett"

[STR_GRF_DESC]
base = "{ORANGE}CIRS-i kogukonna tööstuse asendussett{}{BLACK}Kogukonna hooldatav FIRS-i harg, mille algseid autorid olid andythenorth, FooBar, planetmaker, Terkhen ja Yexo ning mille loomisel aitasid paljud teised. {SILVER}Vaadake veebisaiti lisateabe saamiseks, sealhulgas selle kohta, kuidas CIRS-i kasutada. {BLACK}Litsents: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimum kaugus kaldast kalapüügi väljadest, nafta puurtornidest ja süvenduskohtadest."

[STR_PARAM_DESC_ECONOMIES]
base = "Iga majandus pakub erinevat kauba- ja tööstusharude kombinatsiooni.{}{}Mängijatele, kes soovivad lihtsat mänguprotsessi, sisaldavad {SILVER}põhi- {BLACK}majandused vähem tööstusharusid ja kaupu kui teised CIRS-i majandused.{}{}CIRS-i veebisait pakub üksikasjalikku teavet iga majanduse kohta."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimum ranniku distants meretööstuste vahel ruutudes"

[STR_PARAM_NAME_ECONOMIES]
base = "Majandus"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Limiidita"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Täiustatud esmase tootmise jaoks vajalikud varustuskarbid (vaikimisi 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Gung-ho esmase tootmise jaoks vajalikud varustuskarbid (vaikimisi 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Farmid, kaevandused ja sarnased tööstusharud suurendavad tootmist, kui varustuskarbid kohale toimetatakse: esmalt {SILVER}Täiustatud{BLACK} ja seejärel {SILVER}Gung-ho{BLACK}, kui kohale toimetatakse piisavalt karpe.  {}{}Vaikimisi väärtused on head, kuid vajaduse korral saate neid siin muuta.  {}{}Sadamatüüpi tööstusharude kauba nõuded on siin määratud väärtuste 8-kordne."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Täiustatud esmase tootmise tase (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho esmase tootmise tase (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Tootmine taludes, kaevandustes ja sarnastes tööstusharudes, kui tarnenõuded on täidetud (protsendina {SILVER}normaalsest {BLACK}tootmistasemest)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
