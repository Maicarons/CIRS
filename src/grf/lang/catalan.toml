[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "Conjunt de substitució d'indústries comunitàries de CIRS"

[STR_GRF_DESC]
base = "{ORANGE}Conjunt de substitució d'indústries comunitàries de CIRS{}{BLACK}Una bifurcació de FIRS mantinguda per la comunitat, creada originalment per andythenorth, FooBar, planetmaker, Terkhen i Yexo, amb l'ajuda de moltes altres persones. {SILVER}Consulteu el lloc web per obtenir més informació, inclosa la manera d'utilitzar CIRS. {BLACK}Llicència: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Màxima distància en caselles des de caladors de pesca, plataformes petrolíferes i zones de dragatge fins la costa."

[STR_PARAM_DESC_ECONOMIES]
base = "Cada economia ofereix una combinació diferent de càrregues i indústries.{}{}Per als jugadors que vulguin una jugabilitat senzilla, les economies {SILVER}Bàsiques {BLACK}contenen menys indústries i càrregues que altres economies de CIRS.{}{}El lloc web de CIRS proporciona informació detallada sobre cada economia."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Màxima distància a la costa en caselles per a les indústries marines"

[STR_PARAM_NAME_ECONOMIES]
base = "Economia"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Sense límit"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Caixes de subministrament necessàries per a la producció primària millorada (per defecte, 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Caixes de subministrament necessàries per a la producció primària Gung-ho (per defecte, 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Les granges, les mines i les indústries similars augmentaran la producció quan s'entreguin caixes de subministrament, primer a {SILVER}Enhanced{BLACK} i després a {SILVER}Gung-ho{BLACK}, si s'entreguen prou caixes.  {}{}Els valors predeterminats són adequats, però, si cal, els podeu canviar aquí.  {}{}Els requisits de càrrega per a les indústries de tipus port seran 8 vegades superiors als valors establerts aquí."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Nivell de producció primària millorat (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Nivell de producció primària Gung-ho (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Producció en explotacions agrícoles, mines i indústries similars quan es compleixen els requisits de subministrament (com a percentatge del nivell de producció {SILVER}normal {BLACK})."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Economia Bàsica Temperada"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Economia Bàsica Àrtica"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Economia Bàsica Tropical"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "Heart of Darkness"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Ciutat de l’acer"

[STR_PARAM_NAME_OBJECTS]
base = "Objectes de paisatgisme de CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS inclou un conjunt d'objectes de paisatgisme que els jugadors poden col·locar per fer que determinades indústries semblin més grans. Els objectes de paisatge no tenen cap efecte en la jugabilitat. Els objectes de paisatgisme es poden activar o desactivar."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opcional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(inclòs)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Subministra {WHITE}almenys una {BLACK}càrrega necessària per assolir la producció màxima."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Per assolir la taxa de producció màxima, proveïu {WHITE}ambdues {BLACK}càrregues necessàries almenys un cop cada tres minuts."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Per assolir la taxa de producció màxima, proveïu {WHITE}totes {BLACK}les càrregues necessàries almenys un cop cada tres minuts."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Per assolir la taxa de producció màxima, proveïu {WHITE}almenys dues {BLACK}de les càrregues necessàries almenys un cop cada tres minuts."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Per assolir la taxa de producció màxima, proveïu {WHITE}almenys tres {BLACK}de les càrregues necessàries almenys un cop cada tres minuts."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}La producció és proporcional a la població de la ciutat. Cada minut es produiran almenys {WHITE}{SIGNED_WORD} unitats{BLACK} i com a màxim {WHITE}{SIGNED_WORD} unitats{BLACK} de càrrega."

[STR_PRIMARY_PRODUCTION_1X]
