[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS – Set di sostituzione per industrie comunitarie"

[STR_GRF_DESC]
base = "{ORANGE}CIRS – Set di sostituzione per industrie comunitarie{}{BLACK}Un fork di FIRS mantenuto dalla comunità, originariamente creato da andythenorth, FooBar, planetmaker, Terkhen e Yexo, con l’aiuto di molte altre persone. {SILVER}Consulta il sito web per maggiori informazioni, incluso come utilizzare CIRS. {BLACK}Licenza: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distanza massima, in caselle, di zone di pesca, piattaforme petrolifere e siti di dragaggio dalla costa."

[STR_PARAM_DESC_ECONOMIES]
base = "Ogni economia dà una combinazione diversa di merci e industrie.{}{}Per uno schema di gioco semplificato, un'economia di {SILVER}base {BLACK} comprende meno industrie e merci rispetto ad altre economie di CIRS.{}{}Sul sito web di CIRS si trovano informazioni dettagliate su ogni economia."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Distanza massima dalla costa, in caselle, delle industrie marine"

[STR_PARAM_NAME_ECONOMIES]
base = "Economia"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Illimitata"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Casse di forniture necessarie per il livello di produzione Elevato (valore predefinito: 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Casse di forniture necessarie per il livello di produzione Gung ho (valore predefinito: 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "La produzione delle fattorie, miniere e industrie simili raggiungerà il livello {SILVER}Elevato{BLACK}, e poi il livello {SILVER}Gung ho{BLACK}, se viene consegnato un numero sufficiente di casse.{}{}I valori di default sono già ottimizzati, ma possono essere modificati qui.{}{}Le richieste dei porti e delle industrie simili saranno 8x i valori impostati qui."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Livello di produzione Elevato per industrie primarie (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Livello di produzione Gung ho per industrie primarie (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produzione delle fattorie, miniere e industrie simili, quando le merci richieste vengono consegnate (espresso in percentuale del valore {SILVER}Normale{BLACK} di produzione)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Di base (clima temperato)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Di base (clima artico)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Di base (clima tropicale)"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "In un Paese caldo"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Città d'acciaio"

[STR_PARAM_NAME_OBJECTS]
base = "Oggetti di arredo paesaggistico CIRS"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS include un set di oggetti di arredo paesaggistico che i giocatori possono posizionare per far apparire alcune industrie più grandi. Gli oggetti di arredo non hanno alcun effetto sul gameplay. Possono essere attivati o disattivati."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(opzionale)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = "{BLACK}(consegnato)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Raggiunge il massimo livello di produzione se {WHITE}una qualsiasi {BLACK}delle merci richieste viene consegnata."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Per la massima velocità di produzione, fornisci {WHITE}entrambi i {BLACK}carichi richiesti almeno una volta ogni tre minuti."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Per ottenere la massima velocità di produzione, fornisci {WHITE}tutte le {BLACK}merci necessarie almeno una volta ogni tre minuti."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Per la massima velocità di produzione, fornisci {WHITE}almeno due {BLACK}carichi richiesti almeno una volta ogni tre minuti."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Per la massima velocità di produzione, fornisci {WHITE}almeno tre {BLACK}carichi richiesti almeno una volta ogni tre minuti."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}La produzione è proporzionale alla popolazione cittadina. Ogni mese la produzione sarà compresa tra un minimo di {WHITE}{SIGNED_WORD} unità{BLACK} e non più di {WHITE}{SIGNED_WORD} unità{BLACK} di carico."

[STR_PRIMARY_PRODUCTION_1X]
base = "{BLACK}Produzione attuale: {YELLOW}Normale{}{}{BLACK}Il livello di produzione {WHITE}Elevato {BLACK} si raggiunge consegnando {SIGNED_WORD} casse di forniture entro 3 mesi{}Per salire al livello {WHITE}Gung ho {BLACK} si devono consegnare {SIGNED_WORD} casse."

[STR_PRIMARY_PRODUCTION_2X]
base = "{BLACK}Produzione attuale: {YELLOW}Elevata{}{}{BLACK}Per mantenere questo livello di produzione, si devono consegnare {SIGNED_WORD} casse di forniture entro 3 mesi{}Per salire al livello {WHITE}Gung ho{BLACK} si devono consegnare {SIGNED_WORD} casse."

[STR_PRIMARY_PRODUCTION_4X]
