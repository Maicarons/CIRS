[GLOBAL_PRAGMA]
grflangid = "0x02"
plural = "0"

[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS - Community Industry Replacement Set"

[STR_GRF_DESC]
base = "{ORANGE}CIRS Community Industry Replacement Set{}{BLACK}Eine von der Community gepflegte Abspaltung von FIRS, ursprünglich von andythenorth, FooBar, planetmaker, Terkhen und Yexo, mit Hilfe vieler anderer. {SILVER}Weitere Informationen, einschließlich der Verwendung von CIRS, findest du auf der Website. {BLACK}Lizenz: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximale Entfernung von Fischgründen, Ölplattformen und Baggerstellen von der Küste in Kacheln."

[STR_PARAM_DESC_ECONOMIES]
base = "Jede Wirtschaft bietet eine andere Kombination aus Gütern und Industrien.{}{}Für Spieler, die einfaches Spiel bevorzugen, enthalten {SILVER}Basis-{BLACK}Wirtschaften weniger Industrien und Güter als andere CIRS-Wirtschaften.{}{}Die CIRS-Website bietet detaillierte Informationen zu jeder Wirtschaft."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maximale Küstenentfernung von Seeindustrien in Kacheln"

[STR_PARAM_NAME_ECONOMIES]
base = "Wirtschaft"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Keine Begrenzung"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Versorgungskisten, die für verstärkte Primärproduktion benötigt werden (Standard 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Versorgungskisten, die für begeisterte Primärproduktion benötigt werden (Standard 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Bauernhöfe, Minen und ähnliche Industrien erhöhen die Produktion, wenn Versorgungskisten geliefert werden, zunächst auf {SILVER}Verstärkt{BLACK} und dann auf {SILVER}Begeistert{BLACK}, sofern genügend Kisten geliefert werden.  {}{}Die Standardwerte sind gut, können aber hier geändert werden.  {}{}Die Güteranforderungen für Hafenindustrien betragen das 8-Fache der hier festgelegten Werte."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Verstärkter Primärproduktionsgrad (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Begeisterter Primärproduktionsgrad (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produktion in Bauernhöfen, Minen und ähnlichen Industrien, wenn die Versorgungsanforderungen erfüllt sind (als Prozentsatz des {SILVER}Normalen{BLACK} Produktionsniveaus)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
base = "Gemäßigt (Basis)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_ARCTIC]
base = "Arktis (Basis)"

[STR_PARAM_VALUE_ECONOMIES_BASIC_TROPIC]
base = "Tropisch (Basis)"

[STR_PARAM_VALUE_ECONOMIES_IN_A_HOT_COUNTRY]
base = "In einem heißen Land"

[STR_PARAM_VALUE_ECONOMIES_MILD_MILD_WEST]
base = "Mild Mild West"

[STR_PARAM_VALUE_ECONOMIES_STEELTOWN]
base = "Stahlstadt"

[STR_PARAM_NAME_OBJECTS]
base = "CIRS-Landschaftsobjekte"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS umfasst eine Reihe von Landschaftsobjekten, die Spieler platzieren können, um bestimmte Industrien größer erscheinen zu lassen. Diese Objekte haben keine Auswirkung auf das Spiel. Sie können ein- oder ausgeschaltet werden."

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_OPTIONAL_FLAG]
base = " {BLACK}(optional)"

[STR_CARGO_SUBTYPE_DISPLAY_CARGO_SUPPLIED_FLAG]
base = " {BLACK}(im Lieferumfang enthalten)"

[STR_EXTRA_TEXT_SECONDARY_NON_COMBINATORY]
base = "{BLACK}Liefere {WHITE}mindestens ein{BLACK} benötigtes Gut für maximale Produktion."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_BOTH]
base = "{BLACK}Für maximale Produktionsrate {WHITE}beide{BLACK} benötigten Güter mindestens alle drei Minuten liefern."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ALL]
base = "{BLACK}Für maximale Produktionsrate alle {WHITE}benötigten{BLACK} Güter mindestens alle drei Minuten liefern."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_TWO]
base = "{BLACK}Für maximale Produktionsrate mindestens {WHITE}zwei{BLACK} benötigte Güter mindestens alle drei Minuten liefern."

[STR_EXTRA_TEXT_SECONDARY_COMBINATORY_ANY_THREE]
base = "{BLACK}Für maximale Produktionsrate mindestens {WHITE}drei{BLACK} benötigte Güter mindestens alle drei Minuten liefern."

[STR_EXTRA_TEXT_TOWN_PRODUCER]
base = "{BLACK}Die Produktion ist proportional zur Stadtbevölkerung. Mindestens {WHITE}{SIGNED_WORD} Einheiten{BLACK} und höchstens {WHITE}{SIGNED_WORD} Einheiten{BLACK} Ware werden jede Minute produziert."

[STR_PRIMARY_PRODUCTION_1X]
