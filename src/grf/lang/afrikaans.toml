[STR_GRF_NAME]
# only translate the CIRS name if it's strictly necessary for the language
base = "CIRS-gemeenskapsbedryfsvervangingsstel"

[STR_GRF_DESC]
base = "{ORANGE}CIRS-gemeenskapsbedryfsvervangingsstel{}{BLACK}’n deur die gemeenskap onderhoude vertakking van FIRS, oorspronklik deur andythenorth, FooBar, planetmaker, Terkhen en Yexo, met hulp van talle ander. {SILVER}Sien die webwerf vir meer inligting, insluitend hoe om CIRS te gebruik. {BLACK}Lisensie: GPL v2."

[STR_PARAM_DESC_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Die maksimum afstand teëls wat die vis waters, oliebore en baggerwerk-terreine van die kus af is."

[STR_PARAM_DESC_ECONOMIES]
base = "Elke ekonomie bied ’n ander kombinasie van vragte en nywerhede.{}{}Vir spelers wat eenvoudige spel wil hê, bevat {SILVER}Basiese {BLACK}ekonomieë minder nywerhede en vragte as ander CIRS-ekonomieë.{}{}Die CIRS-webwerf verskaf gedetailleerde inligting oor elke ekonomie."

[STR_PARAM_NAME_COAST_DISTANCE_MARINE_INDUSTRY]
base = "Maksimum kus afstand van mariene nywerhede in teëls"

[STR_PARAM_NAME_ECONOMIES]
base = "Ekonomie"

[STR_PARAM_VALUE_SECONDARY_NEVER_CLOSE_0]
base = "Geen limiet"

[STR_PARAM_NAME_PRIMARY_LEVEL1_REQUIREMENT]
base = "Voorsieningskiste wat vir Verbeterde primêre produksie nodig is (standaard 16)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_REQUIREMENT]
base = "Voorsieningskiste wat vir Gung-ho-primêre produksie nodig is (standaard 80)"

[STR_PARAM_DESC_PRIMARY_LEVEL_REQUIREMENT]
base = "Plase, myne en soortgelyke nywerhede sal produksie verhoog wanneer voorraadkiste afgelewer word, eers aan {SILVER}Verbeterde{BLACK}, en daarna aan {SILVER}Gung-ho{BLACK}, indien genoeg kiste afgelewer word.  {}{}Die standaardwaardes is goed, maar indien nodig kan jy hulle hier verander.  {}{}Laaivereistes vir hawe-tipe nywerhede sal 8 keer die waardes wees wat hier ingestel is."

[STR_PARAM_NAME_PRIMARY_LEVEL1_BONUS]
base = "Verbeterde primêre produksievlak (%)"

[STR_PARAM_NAME_PRIMARY_LEVEL2_BONUS]
base = "Gung-ho-primaireproduksievlak (%)"

[STR_PARAM_DESC_PRIMARY_LEVEL_BONUS]
base = "Produksie op plase, myne en soortgelyke nywerhede wanneer verskaffingsvereistes vervul word (as ’n persentasie van die {SILVER}normale {BLACK}produksievlak)."

[STR_PARAM_VALUE_ECONOMIES_BASIC_TEMPERATE]
