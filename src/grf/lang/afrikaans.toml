[STR_PARAM_NAME_OBJECTS]
base = "CIRS-landskapvoorwerpe"

[STR_PARAM_DESC_OBJECTS]
base = "CIRS sluit ’n stel landskapvoorwerpe in wat spelers kan plaas om sekere nywerhede groter te laat lyk. Landskapvoorwerpe het geen invloed op die spelverloop nie. Landskapvoorwerpe kan aangeskakel of afgeskakel word."

