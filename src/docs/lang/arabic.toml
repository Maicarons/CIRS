DOC_TRANS_TITLE = "الترجمات"
DOC_TRANS_INTRO = "CIRS هو شوكة مجتمعية من FIRS بترجمات مفتوحة للجميع. على عكس FIRS 5، يوفر CIRS نص اللعبة ونص الموقع بعدة لغات."
