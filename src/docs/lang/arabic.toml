DOC_TRANS_HOW = "كيفية المساهمة بترجمة"
DOC_TRANS_HOW_P1 = "يوجد نص اللعبة في src/grf/lang/*.toml (سلاسل NewGRF) وsrc/gs/lang/*.toml (سلاسل GameScript). ويوجد نص الموقع في src/docs/lang/*.toml وsrc/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "انسخ english.toml إلى ملف جديد باسم لغتك، وترجم كل قيمة أساسية، واحتفظ بكل العناصر النائبة مثل {ORANGE} و{}{} و{SIGNED_WORD} دون تغيير. ثم نفّذ tools/check_translations.py للتحقق من تطابق المفاتيح والعناصر النائبة مع المصدر الإنجليزي."
DOC_TRANS_HOW_P3 = "تُقبل الترجمات عبر طلبات السحب على GitHub. راجع README_zh.md وTRANSLATING.md في المستودع للتفاصيل."
DOC_TRANS_HISTORY = "التاريخ"
DOC_TRANS_HISTORY_P1 = "كان FIRS 3.x و4.x يوزع الترجمات كملفات .lng تُدار عبر #openttdcoop Web Translator. أوقف FIRS 5 الترجمات. يستعيد CIRS ترجمة المجتمع بتدفق عمل TOML أبسط وقابل للمراجعة."
DOC_TRANS_THANKS = "شكرًا لكل من ترجم FIRS عبر السنين؛ عملكم هو أساس الترجمة الصينية المضمنة هنا."

