# translations
DOC_TRANS_TITLE = "翻訳"
DOC_TRANS_INTRO = "CIRSは、誰もが参加できる翻訳を備えたFIRSのコミュニティフォークです。FIRS 5とは異なり、CIRSはゲームとウェブサイトのテキストを複数の言語で提供します。"
DOC_TRANS_CURRENT = "現在対応している言語"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "翻訳に貢献するには"
DOC_TRANS_HOW_P1 = "ゲームのテキストは src/grf/lang/*.toml（NewGRF文字列）と src/gs/lang/*.toml（GameScript文字列）にあります。ウェブサイトのテキストは src/docs/lang/*.toml と src/docs/extra_strings*.toml にあります。"
DOC_TRANS_HOW_P2 = "english.tomlを、お使いの言語名で命名した新しいファイルにコピーし、各基本値を翻訳し、{ORANGE}や{}{}や{SIGNED_WORD}などのすべてのプレースホルダを変更せずに保持してください。その後、tools/check_translations.pyを実行し、キーとプレースホルダが英語のソースと一致することを確認します。"
DOC_TRANS_HOW_P3 = "翻訳はGitHubのプルリクエストから受け付けています。詳細はリポジトリ内のREADME_zh.mdとTRANSLATING.mdを参照してください。"
DOC_TRANS_HISTORY = "履歴"
DOC_TRANS_HISTORY_P1 = "FIRS 3.xおよび4.xは、#openttdcoop Web Translatorで管理された.lngファイルとして翻訳を配布していました。FIRS 5は翻訳を廃止しました。CIRSは、よりシンプルでレビュー可能なTOMLワークフローでコミュニティ翻訳を復活させます。"
DOC_TRANS_THANKS = "長年にわたりFIRSを翻訳してきたすべての方に感謝します。あなたの作業は、ここに含まれる中国語翻訳の基礎となっています。"

