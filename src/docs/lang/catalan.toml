# translations
DOC_TRANS_TITLE = "Traduccions"
DOC_TRANS_INTRO = "CIRS és una bifurcació comunitària de FIRS amb traduccions obertes a tothom. A diferència de FIRS 5, CIRS inclou el text del joc i del lloc web en diversos idiomes."
DOC_TRANS_CURRENT = "Idiomes compatibles actualment"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Com contribuir amb una traducció"
DOC_TRANS_HOW_P1 = "El text del joc es troba a src/grf/lang/*.toml (cadenes NewGRF) i src/gs/lang/*.toml (cadenes GameScript). El text del lloc web es troba a src/docs/lang/*.toml i src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copia english.toml a un fitxer nou amb el nom del teu idioma, tradueix cada valor base i mantingues tots els marcadors com {ORANGE}, {}{} i {SIGNED_WORD} sense canvis. Després executa tools/check_translations.py per verificar que les claus i els marcadors coincideixin amb la font en anglès."
DOC_TRANS_HOW_P3 = "Les traduccions s'accepten mitjançant pull requests de GitHub. Consulteu README_zh.md i TRANSLATING.md al repositori per a més detalls."
DOC_TRANS_HISTORY = "Història"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x i 4.x enviaven les traduccions com a fitxers .lng gestionats amb el #openttdcoop Web Translator. FIRS 5 va eliminar les traduccions. CIRS restaura la traducció comunitària amb un flux de treball TOML més simple i revisable."
DOC_TRANS_THANKS = "Gràcies a tothom que ha traduït FIRS al llarg dels anys; la vostra feina és la base de la traducció al xinès inclosa aquí."

