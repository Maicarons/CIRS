# translations
DOC_TRANS_TITLE = "Übersetzungen"
DOC_TRANS_INTRO = "CIRS ist ein Community-Fork von FIRS mit für alle offenen Übersetzungen. Im Gegensatz zu FIRS 5 wird bei CIRS Spieltext und Website-Text in mehreren Sprachen ausgeliefert."
DOC_TRANS_CURRENT = "Derzeit unterstützte Sprachen"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Wie man eine Übersetzung beisteuert"
DOC_TRANS_HOW_P1 = "Der Spieltext befindet sich in src/grf/lang/*.toml (NewGRF-Zeichenketten) und src/gs/lang/*.toml (GameScript-Zeichenketten). Der Website-Text befindet sich in src/docs/lang/*.toml und src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopiere english.toml in eine neue Datei, benannt nach deiner Sprache, übersetze jeden Basiswert und behalte alle Platzhalter wie {ORANGE}, {}{} und {SIGNED_WORD} unverändert bei. Führe dann tools/check_translations.py aus, um zu prüfen, dass Schlüssel und Platzhalter mit der englischen Quelle übereinstimmen."
DOC_TRANS_HOW_P3 = "Übersetzungen werden über GitHub-Pull-Requests angenommen. Siehe README_zh.md und TRANSLATING.md im Repository für Details."
DOC_TRANS_HISTORY = "Geschichte"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x und 4.x lieferte Übersetzungen als .lng-Dateien aus, die mit dem #openttdcoop Web Translator verwaltet wurden. FIRS 5 strich die Übersetzungen. CIRS stellt die Community-Übersetzung mit einem einfacheren, überprüfbaren TOML-Workflow wieder her."
DOC_TRANS_THANKS = "Dank an alle, die FIRS über die Jahre übersetzt haben; eure Arbeit ist die Grundlage der hier enthaltenen chinesischen Übersetzung."

