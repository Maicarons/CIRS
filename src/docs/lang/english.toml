# translations
DOC_TRANS_TITLE = "Translations"
DOC_TRANS_INTRO = "CIRS is a community fork of FIRS with translations open to everyone. Unlike FIRS 5, CIRS ships game text and website text in multiple languages."
DOC_TRANS_CURRENT = "Currently supported languages"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "How to contribute a translation"
DOC_TRANS_HOW_P1 = "Game text lives in src/grf/lang/*.toml (NewGRF strings) and src/gs/lang/*.toml (GameScript strings). Website text lives in src/docs/lang/*.toml and src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copy english.toml to a new file named after your language, translate every base value, and keep all placeholders such as {ORANGE}, {}{} and {SIGNED_WORD} unchanged. Then run tools/check_translations.py to verify that keys and placeholders match the English source."
DOC_TRANS_HOW_P3 = "Translations are accepted through GitHub pull requests. See README_zh.md and TRANSLATING.md in the repository for details."
DOC_TRANS_HISTORY = "History"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x and 4.x shipped translations as .lng files managed with the #openttdcoop Web Translator. FIRS 5 dropped translations. CIRS restores community translation with a simpler, reviewable TOML workflow."
DOC_TRANS_THANKS = "Thanks to everyone who translated FIRS over the years; your work is the foundation of the Chinese translation included here."

