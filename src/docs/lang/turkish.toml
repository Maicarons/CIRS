DOC_TRANS_HOW_P2 = "english.toml dosyasını dilinin adını taşıyan yeni bir dosyaya kopyala, her temel değeri çevir ve {ORANGE}, {}{} ve {SIGNED_WORD} gibi tüm yer tutucuları değiştirmeden koru. Ardından anahtarların ve yer tutucuların İngilizce kaynakla eşleştiğini doğrulamak için tools/check_translations.py komutunu çalıştır."
