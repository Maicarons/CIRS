# translations
DOC_TRANS_TITLE = "Prijevodi"
DOC_TRANS_INTRO = "CIRS je zajednički fork FIRS-a s prijevodima otvorenim za sve. Za razliku od FIRS 5, CIRS isporučuje tekst igre i weba na više jezika."
DOC_TRANS_CURRENT = "Trenutno podržani jezici"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Kako doprinijeti prijevodom"
DOC_TRANS_HOW_P1 = "Tekst igre nalazi se u src/grf/lang/*.toml (nizovi NewGRF) i src/gs/lang/*.toml (nizovi GameScript). Tekst weba nalazi se u src/docs/lang/*.toml i src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopirajte english.toml u novu datoteku nazvanu po vašem jeziku, prevedite svaku osnovnu vrijednost i zadržite sve zamjenske oznake poput {ORANGE}, {}{} i {SIGNED_WORD} nepromijenjenima. Zatim pokrenite tools/check_translations.py da biste provjerili da ključevi i zamjenske oznake odgovaraju engleskom izvoru."
DOC_TRANS_HOW_P3 = "Prijevodi se prihvaćaju putem GitHub pull requestova. Za pojedinosti pogledajte README_zh.md i TRANSLATING.md u repozitoriju."
DOC_TRANS_HISTORY = "Povijest"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x i 4.x isporučivao je prijevode kao .lng datoteke kojima je upravljao #openttdcoop Web Translator. FIRS 5 je odbacio prijevode. CIRS vraća zajedničke prijevode jednostavnijim, preglednim TOML tijekom rada."
DOC_TRANS_THANKS = "Hvala svima koji su tijekom godina prevodili FIRS; vaš rad temelj je kineskog prijevoda uključenog ovdje."

