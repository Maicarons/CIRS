DOC_CR_PRICE_NOTE = "* விலைக் காரணி ஒரு அடிப்படை மதிப்பாகும், இது விலைகள் ஒன்றோடொன்று மேலெழாமல் இருக்கப் பொருளாதாரத்திற்கேற்ப தானாகச் சரிசெய்யப்படும்."
DOC_CR_TOWN_GROWTH_NOTE = "** நகர வளர்ச்சி விளைவுகள்: TOWNGROWTH_PASSENGERS மற்றும் TOWNGROWTH_MAIL தவிர, CIRS எந்த நகர வளர்ச்சி விளைவுகளையும் அமைப்பதில்லை; இதன் விரும்பத்தக்க விளைவு பாலைவனம் மற்றும் பனிக்கோட்டிற்கு மேலுள்ள நகரங்களுக்கான உணவு / நீர் தேவைகளை முடக்குவதாகும்."
