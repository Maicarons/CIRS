# translations
DOC_TRANS_TITLE = "மொழிபெயர்ப்புகள்"
DOC_TRANS_INTRO = "CIRS என்பது FIRSஇன் சமூகக் கிளை, அனைவருக்கும் திறந்த மொழிபெயர்ப்புகளுடன். FIRS 5ஐ விட வேறுபட்டு, CIRS விளையாட்டு மற்றும் இணையதள உரையைப் பல மொழிகளிலும் வழங்குகிறது."
DOC_TRANS_CURRENT = "தற்போது ஆதரிக்கப்படும் மொழிகள்"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "மொழிபெயர்ப்பை எவ்வாறு பங்களிப்பது"
DOC_TRANS_HOW_P1 = "விளையாட்டு உரை src/grf/lang/*.toml (NewGRF சரங்கள்) மற்றும் src/gs/lang/*.toml (GameScript சரங்கள்) ஆகியவற்றில் உள்ளது. இணையதள உரை src/docs/lang/*.toml மற்றும் src/docs/extra_strings*.toml ஆகியவற்றில் உள்ளது."
DOC_TRANS_HOW_P2 = "english.tomlஐ உங்கள் மொழியின் பெயரால் புதிய கோப்பாக நகலெடுத்து, ஒவ்வொரு அடிப்படை மதிப்பையும் மொழிபெயர்த்து, {ORANGE}, {}{} மற்றும் {SIGNED_WORD} போன்ற அனைத்து உள்ளிடுநிலைக் குறிகளையும் மாறாமல் வைக்கவும். பின்னர் ஆங்கில மூலத்துடன் விசைகளும் உள்ளிடுநிலைக் குறிகளும் பொருந்துகின்றனவா எனச் சரிபார்க்க tools/check_translations.pyஐ இயக்கவும்."
DOC_TRANS_HOW_P3 = "மொழிபெயர்ப்புகள் GitHub pull requestகள் வழியாக ஏற்றுக்கொள்ளப்படுகின்றன. விவரங்களுக்குக் களஞ்சியத்திலுள்ள README_zh.md மற்றும் TRANSLATING.mdஐக் காண்க."
DOC_TRANS_HISTORY = "வரலாறு"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x மற்றும் 4.x மொழிபெயர்ப்புகளை #openttdcoop Web Translator மூலம் நிர்வகிக்கப்பட்ட .lng கோப்புகளாக வழங்கின. FIRS 5 மொழிபெயர்ப்புகளைக் கைவிட்டது. CIRS எளிமையான, மீளாய்வு செய்யக்கூடிய TOML பணிப்பாய்ச்சல் மூலம் சமூக மொழிபெயர்ப்பை மீட்டெடுக்கிறது."
DOC_TRANS_THANKS = "ஆண்டுகளாக FIRSஐ மொழிபெயர்த்த அனைவருக்கும் நன்றி; உங்கள் பணிதான் இங்கு சேர்க்கப்பட்டுள்ள சீன மொழிபெயர்ப்பின் அடித்தளம்."

# home page and site-wide extras
DOC_HOME_TAGLINE = "திறந்த மொழிபெயர்ப்புகள் மற்றும் திறந்த ஆதரவுடன் OpenTTDக்கான FIRS சமூகக் கிளை."
DOC_HOME_WHY_TITLE = "ஏன் CIRS?"
DOC_HOME_WHY_1_TITLE = "திறந்த சமூக ஆதரவு"
DOC_HOME_WHY_1_DESC = "Issues மற்றும் pull requestகள் இங்கு மீளாய்வு செய்யப்பட்டுப் பிணைக்கப்படும்."
DOC_HOME_WHY_2_TITLE = "திறந்த மொழிபெயர்ப்புகள்"
DOC_HOME_WHY_2_DESC = "விளையாட்டு மற்றும் இணையதள உரை எளிய TOML கோப்புகள் மூலம், குறியீடு போல மீளாய்வு செய்யப்பட்டு மொழிபெயர்க்கப்படுகிறது."
DOC_HOME_WHY_3_TITLE = "மேலோடைக் கண்காணிப்பு"
DOC_HOME_WHY_3_DESC = "FIRSஇன் முழு git வரலாறும் பாதுகாக்கப்படுகிறது, எனவே எதிர்கால மேலோடை மாற்றங்களைக் கிளை (fork) உருவாக்காமல் இணைக்க முடியும்."
DOC_HOME_EXPLORE_TITLE = "தொகுப்பை ஆராய்"
DOC_CHANGELOG_EN_ONLY = "மாற்றப் பதிவு ஆங்கிலத்தில் மட்டுமே பராமரிக்கப்படுகிறது."

