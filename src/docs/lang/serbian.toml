# translations
DOC_TRANS_TITLE = "Prevodi"
DOC_TRANS_INTRO = "CIRS je zajednički fork FIRS-a sa prevodima otvorenim za sve. Za razliku od FIRS 5, CIRS isporučuje tekst igre i veba na više jezika."
DOC_TRANS_CURRENT = "Trenutno podržani jezici"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Kako doprineti prevodom"
DOC_TRANS_HOW_P1 = "Tekst igre se nalazi u src/grf/lang/*.toml (nizovi NewGRF) i src/gs/lang/*.toml (nizovi GameScript). Tekst veba nalazi se u src/docs/lang/*.toml i src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopirajte english.toml u novu datoteku nazvanu po vašem jeziku, prevedite svaku osnovnu vrednost i zadržite sve zamenske oznake poput {ORANGE}, {}{} i {SIGNED_WORD} nepromenjenima. Zatim pokrenite tools/check_translations.py da biste proverili da ključevi i zamenske oznake odgovaraju engleskom izvoru."
DOC_TRANS_HOW_P3 = "Prevodi se prihvataju putem GitHub pull requestova. Za pojedinosti pogledajte README_zh.md i TRANSLATING.md u repozitorijumu."
DOC_TRANS_HISTORY = "Istorija"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x i 4.x isporučivao je prevode kao .lng datoteke kojima je upravljao #openttdcoop Web Translator. FIRS 5 je odbacio prevode. CIRS vraća zajedničke prevode jednostavnijim, preglednim TOML tokom rada."
DOC_TRANS_THANKS = "Hvala svima koji su tokom godina prevodili FIRS; vaš rad je osnova kineskog prevoda uključenog ovde."

