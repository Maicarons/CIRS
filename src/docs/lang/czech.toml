DOC_TRANS_HOW = "Jak přispět překladem"
DOC_TRANS_HOW_P1 = "Text hry se nachází v src/grf/lang/*.toml (řetězce NewGRF) a src/gs/lang/*.toml (řetězce GameScript). Text webu se nachází v src/docs/lang/*.toml a src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Zkopírujte english.toml do nového souboru pojmenovaného podle vašeho jazyka, přeložte každou základní hodnotu a ponechte všechny zástupné symboly jako {ORANGE}, {}{} a {SIGNED_WORD} nezměněné. Poté spusťte tools/check_translations.py a ověřte, že klíče a zástupné symboly odpovídají anglickému zdroji."
DOC_TRANS_HOW_P3 = "Překlady jsou přijímány prostřednictvím pull requestů na GitHubu. Podrobnosti viz README_zh.md a TRANSLATING.md v repozitáři."
DOC_TRANS_HISTORY = "Historie"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x a 4.x dodávaly překlady jako soubory .lng spravované pomocí #openttdcoop Web Translator. FIRS 5 překlady zrušil. CIRS obnovuje komunitní překlady jednodušším, kontrolovatelným pracovním postupem TOML."
DOC_TRANS_THANKS = "Děkujeme všem, kteří přeložili FIRS v průběhu let; vaše práce je základem čínského překladu obsaženého zde."

