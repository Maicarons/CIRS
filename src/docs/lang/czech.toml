DOC_TRANS_TITLE = "Překlady"
DOC_TRANS_INTRO = "CIRS je komunitní fork FIRS s překlady otevřenými všem. Na rozdíl od FIRS 5 dodává CIRS text hry i webu ve více jazycích."
