# translations
DOC_TRANS_TITLE = "Traductions"
DOC_TRANS_INTRO = "CIRS est un fork communautaire de FIRS avec des traductions ouvertes à tous. Contrairement à FIRS 5, CIRS propose le texte du jeu et du site web en plusieurs langues."
DOC_TRANS_CURRENT = "Langues actuellement prises en charge"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Comment contribuer une traduction"
DOC_TRANS_HOW_P1 = "Le texte du jeu se trouve dans src/grf/lang/*.toml (chaînes NewGRF) et src/gs/lang/*.toml (chaînes GameScript). Le texte du site web se trouve dans src/docs/lang/*.toml et src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copiez english.toml dans un nouveau fichier nommé selon votre langue, traduisez chaque valeur de base, et conservez tous les espaces réservés tels que {ORANGE}, {}{} et {SIGNED_WORD} inchangés. Ensuite, exécutez tools/check_translations.py pour vérifier que les clés et espaces réservés correspondent au source anglais."
DOC_TRANS_HOW_P3 = "Les traductions sont acceptées via des pull requests GitHub. Voir README_zh.md et TRANSLATING.md dans le dépôt pour les détails."
DOC_TRANS_HISTORY = "Historique"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x et 4.x livraient les traductions sous forme de fichiers .lng gérés avec le #openttdcoop Web Translator. FIRS 5 a abandonné les traductions. CIRS restaure la traduction communautaire avec un flux de travail TOML plus simple et révisable."
DOC_TRANS_THANKS = "Merci à tous ceux qui ont traduit FIRS au fil des ans ; votre travail est le fondement de la traduction chinoise incluse ici."

