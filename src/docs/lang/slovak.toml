DOC_TRANS_HOW = "Ako prispieť prekladom"
DOC_TRANS_HOW_P1 = "Text hry sa nachádza v src/grf/lang/*.toml (reťazce NewGRF) a src/gs/lang/*.toml (reťazce GameScript). Text webu sa nachádza v src/docs/lang/*.toml a src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Skopírujte english.toml do nového súboru pomenovaného podľa vášho jazyka, preložte každú základnú hodnotu a ponechajte všetky zástupné symboly ako {ORANGE}, {}{} a {SIGNED_WORD} nezmenené. Potom spustite tools/check_translations.py a overte, že kľúče a zástupné symboly zodpovedajú anglickému zdroju."
DOC_TRANS_HOW_P3 = "Preklady sú prijímané cez pull requesty na GitHubi. Podrobnosti pozri README_zh.md a TRANSLATING.md v repozitáři."
DOC_TRANS_HISTORY = "História"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x a 4.x dodávali preklady ako súbory .lng spravované pomocou #openttdcoop Web Translator. FIRS 5 preklady zrušil. CIRS obnovuje komunitné preklady jednoduchším, kontrolovateľným pracovným postupom TOML."
DOC_TRANS_THANKS = "Ďakujeme všetkým, ktorí preložili FIRS počas rokov; vaša práca je základom čínskeho prekladu uvedeného tu."

