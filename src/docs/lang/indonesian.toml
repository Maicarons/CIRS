# translations
DOC_TRANS_TITLE = "Terjemahan"
DOC_TRANS_INTRO = "CIRS adalah fork komunitas FIRS dengan terjemahan terbuka untuk semua orang. Berbeda dengan FIRS 5, CIRS menyediakan teks permainan dan situs web dalam beberapa bahasa."
DOC_TRANS_CURRENT = "Bahasa yang saat ini didukung"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Cara berkontribusi terjemahan"
DOC_TRANS_HOW_P1 = "Teks permainan berada di src/grf/lang/*.toml (string NewGRF) dan src/gs/lang/*.toml (string GameScript). Teks situs web berada di src/docs/lang/*.toml dan src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Salin english.toml ke file baru yang diberi nama bahasa Anda, terjemahkan setiap nilai dasar, dan pertahankan semua placeholder seperti {ORANGE}, {}{} dan {SIGNED_WORD} tetap tidak berubah. Lalu jalankan tools/check_translations.py untuk memverifikasi bahwa kunci dan placeholder sesuai dengan sumber bahasa Inggris."
DOC_TRANS_HOW_P3 = "Terjemahan diterima melalui pull request GitHub. Lihat README_zh.md dan TRANSLATING.md di repositori untuk detailnya."
DOC_TRANS_HISTORY = "Sejarah"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x dan 4.x mendistribusikan terjemahan sebagai file .lng yang dikelola dengan #openttdcoop Web Translator. FIRS 5 menghapus terjemahan. CIRS menghidupkan kembali terjemahan komunitas dengan alur kerja TOML yang lebih sederhana dan dapat ditinjau."
DOC_TRANS_THANKS = "Terima kasih kepada semua yang telah menerjemahkan FIRS selama bertahun-tahun; karya Anda adalah dasar terjemahan Mandarin yang disertakan di sini."

