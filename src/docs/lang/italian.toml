# translations
DOC_TRANS_TITLE = "Traduzioni"
DOC_TRANS_INTRO = "CIRS è un fork comunitario di FIRS con traduzioni aperte a tutti. A differenza di FIRS 5, CIRS fornisce il testo di gioco e del sito web in più lingue."
DOC_TRANS_CURRENT = "Lingue attualmente supportate"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Come contribuire a una traduzione"
DOC_TRANS_HOW_P1 = "Il testo di gioco si trova in src/grf/lang/*.toml (stringhe NewGRF) e src/gs/lang/*.toml (stringhe GameScript). Il testo del sito web si trova in src/docs/lang/*.toml e src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copia english.toml in un nuovo file denominato secondo la tua lingua, traduci ogni valore base e mantieni invariati tutti i segnaposto come {ORANGE}, {}{} e {SIGNED_WORD}. Esegui poi tools/check_translations.py per verificare che chiavi e segnaposto corrispondano al sorgente inglese."
DOC_TRANS_HOW_P3 = "Le traduzioni sono accettate tramite pull request su GitHub. Vedi README_zh.md e TRANSLATING.md nel repository per i dettagli."
DOC_TRANS_HISTORY = "Cronologia"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x e 4.x distribuivano le traduzioni come file .lng gestiti con il #openttdcoop Web Translator. FIRS 5 ha abbandonato le traduzioni. CIRS ripristina la traduzione comunitaria con un flusso di lavoro TOML più semplice e revisionabile."
DOC_TRANS_THANKS = "Grazie a tutti coloro che hanno tradotto FIRS nel corso degli anni; il vostro lavoro è la base della traduzione cinese inclusa qui."

