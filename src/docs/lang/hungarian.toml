# translations
DOC_TRANS_TITLE = "Fordítások"
DOC_TRANS_INTRO = "A CIRS a FIRS közösségi ága, mindenki számára nyitott fordításokkal. A FIRS 5-től eltérően a CIRS a játék- és webhelyszöveget több nyelven is szolgáltatja."
DOC_TRANS_CURRENT = "Jelenleg támogatott nyelvek"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Hogyan járulhatsz hozzá fordítással"
DOC_TRANS_HOW_P1 = "A játékszöveg az src/grf/lang/*.toml (NewGRF szövegek) és src/gs/lang/*.toml (GameScript szövegek) helyen található. A webhelyszöveg az src/docs/lang/*.toml és src/docs/extra_strings*.toml fájlokban van."
DOC_TRANS_HOW_P2 = "Másold az english.toml fájlt egy, a nyelvedről elnevezett új fájlba, fordítsd le az egyes alapértékeket, és hagyd változatlanul az összes helyőrzőt, például az {ORANGE}, {}{} és {SIGNED_WORD} jelöléseket. Ezután futtasd a tools/check_translations.py parancsot, hogy ellenőrizd: a kulcsok és helyőrzők megegyeznek-e az angol forrással."
DOC_TRANS_HOW_P3 = "A fordításokat GitHub pull requesteken keresztül fogadjuk el. Részletekért lásd a README_zh.md és TRANSLATING.md fájlokat a tárolóban."
DOC_TRANS_HISTORY = "Történet"
DOC_TRANS_HISTORY_P1 = "A FIRS 3.x és 4.x a fordításokat .lng fájlokként szállította, amelyeket a #openttdcoop Web Translator kezelt. A FIRS 5 elhagyta a fordításokat. A CIRS egy egyszerűbb, átvizsgálható TOML munkafolyamattal éleszti újra a közösségi fordítást."
DOC_TRANS_THANKS = "Köszönet mindenkinek, aki az évek során fordította a FIRS-t; a munkátok az itt szereplő kínai fordítás alapja."

