# translations
DOC_TRANS_TITLE = "翻译"
DOC_TRANS_INTRO = "CIRS 是 FIRS 的社区分支，翻译向所有人开放。与 FIRS 5 不同，CIRS 以多种语言提供游戏文本和网站文本。"
DOC_TRANS_CURRENT = "当前支持的语言"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "如何贡献翻译"
DOC_TRANS_HOW_P1 = "游戏文本位于 src/grf/lang/*.toml（NewGRF 字符串）和 src/gs/lang/*.toml（GameScript 字符串）。网站文本位于 src/docs/lang/*.toml 和 src/docs/extra_strings*.toml。"
DOC_TRANS_HOW_P2 = "将 english.toml 复制为以你的语言命名的新文件，翻译每个 base 值，并保持所有占位符（如 {ORANGE}、{}{} 和 {SIGNED_WORD}）不变。然后运行 tools/check_translations.py，以验证键和占位符与英文源一致。"
DOC_TRANS_HOW_P3 = "翻译通过 GitHub 拉取请求提交。详情请参阅仓库中的 README_zh.md 和 TRANSLATING.md。"
DOC_TRANS_HISTORY = "历史"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x 和 4.x 以 .lng 文件形式提供翻译，由 #openttdcoop Web Translator 管理。FIRS 5 放弃了翻译。CIRS 通过更简单、可审阅的 TOML 工作流恢复了社区翻译。"
DOC_TRANS_THANKS = "感谢多年来所有为 FIRS 翻译的人；你们的工作是此处中文翻译的基础。"

