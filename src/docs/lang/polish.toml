# translations
DOC_TRANS_TITLE = "Tłumaczenia"
DOC_TRANS_INTRO = "CIRS to fork społecznościowy FIRS z otwartymi tłumaczeniami dla wszystkich. W przeciwieństwie do FIRS 5, CIRS dostarcza tekst gry i strony internetowej w wielu językach."
DOC_TRANS_CURRENT = "Obecnie wspierane języki"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Jak przyczynić się do tłumaczenia"
DOC_TRANS_HOW_P1 = "Tekst gry znajduje się w src/grf/lang/*.toml (ciągi NewGRF) i src/gs/lang/*.toml (ciągi GameScript). Tekst strony internetowej znajduje się w src/docs/lang/*.toml i src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Skopiuj english.toml do nowego pliku nazwanego według swojego języka, przetłumacz każdą wartość bazową i zachowaj wszystkie symbole zastępcze takie jak {ORANGE}, {}{} i {SIGNED_WORD} bez zmian. Następnie uruchom tools/check_translations.py, aby sprawdzić, czy klucze i symbole zastępcze odpowiadają angielskiemu źródłu."
DOC_TRANS_HOW_P3 = "Tłumaczenia są przyjmowane przez pull requesty na GitHubie. Zobacz README_zh.md i TRANSLATING.md w repozytorium, aby uzyskać szczegóły."
DOC_TRANS_HISTORY = "Historia"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x i 4.x dostarczał tłumaczenia jako pliki .lng zarządzane przez #openttdcoop Web Translator. FIRS 5 porzucił tłumaczenia. CIRS przywraca tłumaczenie społecznościowe prostszym, weryfikowalnym przepływem pracy TOML."
DOC_TRANS_THANKS = "Podziękowania dla wszystkich, którzy tłumaczyli FIRS przez lata; Wasza praca jest podstawą dołączonego tutaj tłumaczenia na język chiński."

