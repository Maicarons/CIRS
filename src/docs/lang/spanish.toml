# translations
DOC_TRANS_TITLE = "Traducciones"
DOC_TRANS_INTRO = "CIRS es una bifurcación comunitaria de FIRS con traducciones abiertas a todos. A diferencia de FIRS 5, CIRS incluye el texto del juego y del sitio web en varios idiomas."
DOC_TRANS_CURRENT = "Idiomas compatibles actualmente"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Cómo contribuir con una traducción"
DOC_TRANS_HOW_P1 = "El texto del juego se encuentra en src/grf/lang/*.toml (cadenas NewGRF) y src/gs/lang/*.toml (cadenas GameScript). El texto del sitio web se encuentra en src/docs/lang/*.toml y src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copia english.toml a un nuevo archivo con el nombre de tu idioma, traduce cada valor base y mantén todos los marcadores como {ORANGE}, {}{} y {SIGNED_WORD} sin cambios. Luego ejecuta tools/check_translations.py para verificar que las claves y los marcadores coincidan con la fuente en inglés."
DOC_TRANS_HOW_P3 = "Las traducciones se aceptan mediante pull requests de GitHub. Consulta README_zh.md y TRANSLATING.md en el repositorio para más detalles."
DOC_TRANS_HISTORY = "Historia"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x y 4.x enviaban las traducciones como archivos .lng gestionados con el #openttdcoop Web Translator. FIRS 5 eliminó las traducciones. CIRS restaura la traducción comunitaria con un flujo de trabajo TOML más simple y revisable."
DOC_TRANS_THANKS = "Gracias a todos los que tradujeron FIRS a lo largo de los años; vuestro trabajo es la base de la traducción al chino incluida aquí."

