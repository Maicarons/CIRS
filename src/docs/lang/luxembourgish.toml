# translations
DOC_TRANS_TITLE = "Iwwersetzungen"
DOC_TRANS_INTRO = "CIRS ass e Community-Fork vu FIRS mat Iwwersetzungen oppen fir jiddereen. Am Géigesaz zu FIRS 5 liwwert CIRS Spilltext a Websäit-Text a méi Sproochen."
