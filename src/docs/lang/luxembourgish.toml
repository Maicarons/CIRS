DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Wéi een eng Iwwersetzung bäidréit"
DOC_TRANS_HOW_P1 = "De Spilltext ass an src/grf/lang/*.toml (NewGRF Strings) a src/gs/lang/*.toml (GameScript Strings). De Websäit-Text ass an src/docs/lang/*.toml a src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopéiert english.toml an eng nei Fichier genannt nodeems déng Sprooch, iwwersetzt all Basiswert a behalen all Plazhalter wéi {ORANGE}, {}{} a {SIGNED_WORD} onverännert. Féiert dann tools/check_translations.py aus fir ze verifizéieren datt d'Schlësselen a Plazhalter mat der englescher Quell iwwerene stëmmen."
DOC_TRANS_HOW_P3 = "Iwwersetzunge ginn duerch GitHub pull requests akzeptéiert. Kuck README_zh.md a TRANSLATING.md am Repository fir Detailer."
DOC_TRANS_HISTORY = "Geschicht"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x a 4.x hunn Iwwersetzunge als .lng Fichieren ausgeliwwert déi mam #openttdcoop Web Translator verwalt goufen. FIRS 5 huet Iwwersetzunge fallgelooss. CIRS stellt d'Community-Iwwersetzung mat engem méi einfachen, iwwerpréifbare TOML-Workflow erëm hiert."
DOC_TRANS_THANKS = "Merci un all déi FIRS iwwer d'Jore iwwersat hunn; är Aarbecht ass d'Basis vun der hei abannter chinesescher Iwwersetzung."

