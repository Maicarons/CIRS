# translations
DOC_TRANS_TITLE = "Traduções"
DOC_TRANS_INTRO = "CIRS é um fork comunitário do FIRS com traduções abertas a todos. Ao contrário do FIRS 5, o CIRS inclui o texto do jogo e do site em vários idiomas."
DOC_TRANS_CURRENT = "Idiomas atualmente suportados"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Como contribuir com uma tradução"
DOC_TRANS_HOW_P1 = "O texto do jogo está em src/grf/lang/*.toml (strings NewGRF) e src/gs/lang/*.toml (strings GameScript). O texto do site está em src/docs/lang/*.toml e src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copie english.toml para um novo arquivo com o nome do seu idioma, traduza cada valor base e mantenha todos os marcadores como {ORANGE}, {}{} e {SIGNED_WORD} inalterados. Depois execute tools/check_translations.py para verificar se as chaves e os marcadores correspondem à fonte em inglês."
DOC_TRANS_HOW_P3 = "As traduções são aceitas via pull requests do GitHub. Veja README_zh.md e TRANSLATING.md no repositório para detalhes."
DOC_TRANS_HISTORY = "História"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x e 4.x enviavam as traduções como arquivos .lng gerenciados com o #openttdcoop Web Translator. FIRS 5 descartou as traduções. CIRS restaura a tradução comunitária com um fluxo de trabalho TOML mais simples e verificável."
DOC_TRANS_THANKS = "Obrigado a todos que traduziram o FIRS ao longo dos anos; seu trabalho é a base da tradução para o chinês incluída aqui."

