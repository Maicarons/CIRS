DOC_TRANS_HOW = "Så här bidrar du med en översättning"
DOC_TRANS_HOW_P1 = "Speltexten finns i src/grf/lang/*.toml (NewGRF-strängar) och src/gs/lang/*.toml (GameScript-strängar). Webbplatstexten finns i src/docs/lang/*.toml och src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopiera english.toml till en ny fil döpt efter ditt språk, översätt varje basvärde och behåll alla platshållare som {ORANGE}, {}{} och {SIGNED_WORD} oförändrade. Kör sedan tools/check_translations.py för att kontrollera att nycklar och platshållare matchar den engelska källan."
