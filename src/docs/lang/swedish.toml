DOC_TRANS_HISTORY_P1 = "FIRS 3.x och 4.x levererade översättningar som .lng-filer som hanterades med #openttdcoop Web Translator. FIRS 5 tog bort översättningarna. CIRS återställer community-översättningen med ett enklare, granskningsbart TOML-flöde."
DOC_TRANS_THANKS = "Tack till alla som översatt FIRS genom åren; ert arbete är grunden för den kinesiska översättningen som ingår här."

