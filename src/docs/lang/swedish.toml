DOC_TRANS_TITLE = "Översättningar"
DOC_TRANS_INTRO = "CIRS är en community-fork av FIRS med öppna översättningar för alla. Till skillnad från FIRS 5 levereras speltext och webbplatstext på flera språk med CIRS."
