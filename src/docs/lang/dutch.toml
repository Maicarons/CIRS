# translations
DOC_TRANS_TITLE = "Vertalingen"
DOC_TRANS_INTRO = "CIRS is een community-fork van FIRS met open vertalingen voor iedereen. In tegenstelling tot FIRS 5 wordt bij CIRS de speltekst en websitetekst in meerdere talen geleverd."
DOC_TRANS_CURRENT = "Momenteel ondersteunde talen"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Hoe je een vertaling bijdraagt"
DOC_TRANS_HOW_P1 = "De speltekst staat in src/grf/lang/*.toml (NewGRF-tekenreeksen) en src/gs/lang/*.toml (GameScript-tekenreeksen). De websitetekst staat in src/docs/lang/*.toml en src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopieer english.toml naar een nieuw bestand, genoemd naar je taal, vertaal elke basiswaarde en houd alle plaatsaanduidingen zoals {ORANGE}, {}{} en {SIGNED_WORD} ongewijzigd. Voer vervolgens tools/check_translations.py uit om te controleren of sleutels en plaatsaanduidingen overeenkomen met de Engelse bron."
DOC_TRANS_HOW_P3 = "Vertalingen worden geaccepteerd via GitHub-pullrequests. Zie README_zh.md en TRANSLATING.md in de repository voor details."
DOC_TRANS_HISTORY = "Geschiedenis"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x en 4.x leverden vertalingen als .lng-bestanden die werden beheerd met de #openttdcoop Web Translator. FIRS 5 schrapte de vertalingen. CIRS herstelt de community-vertaling met een eenvoudigere, controleerbare TOML-werkstroom."
DOC_TRANS_THANKS = "Dank aan iedereen die FIRS door de jaren heen heeft vertaald; jullie werk is de basis van de hier opgenomen Chinese vertaling."

