DOC_TRANS_TITLE = "Vertalings"
DOC_TRANS_INTRO = "CIRS is 'n gemeenskapsvurk van FIRS met vertalings oop vir almal. Anders as FIRS 5 lewer CIRS speleteks en werf-teks in veelvuldige tale."
DOC_TRANS_CURRENT = "Tans ondersteunde tale"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Hoe om 'n vertaling by te dra"
DOC_TRANS_HOW_P1 = "Speleteks woon in src/grf/lang/*.toml (NewGRF-stringe) en src/gs/lang/*.toml (GameScript-stringe). Werf-teks woon in src/docs/lang/*.toml en src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopieer english.toml na 'n nuwe lêer met jou taal se naam, vertaal elke basiswaarde, en hou alle tussenhouders soos {ORANGE}, {}{} en {SIGNED_WORD} onveranderd. Voer dan tools/check_translations.py uit om te verifieer dat sleutels en tussenhouders met die Engelse bron ooreenstem."
DOC_TRANS_HOW_P3 = "Vertalings word aanvaar deur GitHub-pull-requeste. Sien README_zh.md en TRANSLATING.md in die bewaarplek vir besonderhede."
DOC_TRANS_HISTORY = "Geskiedenis"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x en 4.x het vertalings as .lng-lêers gestuur wat met die #openttdcoop Web Translator bestuur is. FIRS 5 het vertalings laat vaar. CIRS herstel gemeenskapsvertaling met 'n eenvoudiger, nasienbare TOML-werkvloei."
DOC_TRANS_THANKS = "Dankie aan almal wat oor die jare FIRS vertaal het; julle werk is die grondslag van die Chinese vertaling hier ingesluit."

