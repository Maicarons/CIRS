# translations
DOC_TRANS_TITLE = "Переводы"
DOC_TRANS_INTRO = "CIRS — это созданная сообществом ответвлённая версия FIRS с переводами, открытыми для всех. В отличие от FIRS 5, CIRS поставляет текст игры и сайта на нескольких языках."
DOC_TRANS_CURRENT = "Поддерживаемые в настоящее время языки"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Как внести перевод"
DOC_TRANS_HOW_P1 = "Текст игры находится в src/grf/lang/*.toml (строки NewGRF) и src/gs/lang/*.toml (строки GameScript). Текст сайта находится в src/docs/lang/*.toml и src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Скопируйте english.toml в новый файл с названием вашего языка, переведите каждое базовое значение и сохраните все заполнители, такие как {ORANGE}, {}{} и {SIGNED_WORD}, без изменений. Затем запустите tools/check_translations.py, чтобы убедиться, что ключи и заполнители соответствуют английскому источнику."
DOC_TRANS_HOW_P3 = "Переводы принимаются через pull request на GitHub. Подробности см. в README_zh.md и TRANSLATING.md в репозитории."
DOC_TRANS_HISTORY = "История"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x и 4.x поставлял переводы как файлы .lng, управляемые через #openttdcoop Web Translator. FIRS 5 отказался от переводов. CIRS возрождает переводы сообщества с помощью более простого, проверяемого рабочего процесса TOML."
DOC_TRANS_THANKS = "Спасибо всем, кто переводил FIRS на протяжении многих лет; ваша работа — основа китайского перевода, включённого сюда."

