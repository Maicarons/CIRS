DOC_TRANS_TITLE = "Oversættelser"
DOC_TRANS_INTRO = "CIRS er en community-fork af FIRS med åbne oversættelser til alle. I modsætning til FIRS 5 leveres spiltekst og hjemmesidetekst på flere sprog med CIRS."
