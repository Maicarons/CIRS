DOC_TRANS_HOW_P2 = "Kopier english.toml til en ny fil navngivet efter dit sprog, oversæt hver basisværdi, og behold alle pladsholdere som {ORANGE}, {}{} og {SIGNED_WORD} uændrede. Kør derefter tools/check_translations.py for at kontrollere, at nøgler og pladsholdere matcher den engelske kilde."
