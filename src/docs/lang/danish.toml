DOC_TRANS_HISTORY_P1 = "FIRS 3.x og 4.x leverede oversættelser som .lng-filer, der blev administreret med #openttdcoop Web Translator. FIRS 5 droppede oversættelserne. CIRS genopretter community-oversættelsen med en enklere, kontrollerbar TOML-arbejdsgang."
DOC_TRANS_THANKS = "Tak til alle, der har oversat FIRS gennem årene; jeres arbejde er grundlaget for den kinesiske oversættelse inkluderet her."

