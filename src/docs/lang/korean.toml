# translations
DOC_TRANS_TITLE = "번역"
DOC_TRANS_INTRO = "CIRS는 모두에게 열린 번역이 있는 FIRS의 커뮤니티 포크입니다. FIRS 5와 달리 CIRS는 게임 텍스트와 웹사이트 텍스트를 여러 언어로 제공합니다."
DOC_TRANS_CURRENT = "현재 지원되는 언어"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "번역에 기여하는 방법"
DOC_TRANS_HOW_P1 = "게임 텍스트는 src/grf/lang/*.toml (NewGRF 문자열) 및 src/gs/lang/*.toml (GameScript 문자열)에 있습니다. 웹사이트 텍스트는 src/docs/lang/*.toml 및 src/docs/extra_strings*.toml에 있습니다."
DOC_TRANS_HOW_P2 = "english.toml을 언어 이름으로 된 새 파일로 복사하고, 각 기본값을 번역하며, {ORANGE}, {}{} 및 {SIGNED_WORD}와 같은 모든 자리 표시자는 변경하지 않고 유지하세요. 그런 다음 tools/check_translations.py를 실행하여 키와 자리 표시자가 영어 소스와 일치하는지 확인하세요."
DOC_TRANS_HOW_P3 = "번역은 GitHub 풀 리퀘스트를 통해 받습니다. 자세한 내용은 저장소의 README_zh.md 및 TRANSLATING.md를 참조하세요."
DOC_TRANS_HISTORY = "역사"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x 및 4.x는 #openttdcoop 웹 번역기를 통해 관리되는 .lng 파일로 번역을 제공했습니다. FIRS 5는 번역을 중단했습니다. CIRS는 더 간단하고 검토 가능한 TOML 워크플로로 커뮤니티 번역을 복원합니다."
DOC_TRANS_THANKS = "수년에 걸쳐 FIRS를 번역한 모든 분께 감사드립니다. 여러분의 작업은 여기에 포함된 중국어 번역의 기초입니다."

