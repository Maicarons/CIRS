# translations
DOC_TRANS_TITLE = "Traducións"
DOC_TRANS_INTRO = "CIRS é unha bifurcación comunitaria de FIRS con traducións abertas a todos. A diferenza de FIRS 5, CIRS inclúe o texto do xogo e do sitio web en varios idiomas."
DOC_TRANS_CURRENT = "Idiomas compatibles actualmente"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Como contribuír cunha tradución"
DOC_TRANS_HOW_P1 = "O texto do xogo atópase en src/grf/lang/*.toml (cadeas NewGRF) e src/gs/lang/*.toml (cadeas GameScript). O texto do sitio web atópase en src/docs/lang/*.toml e src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copia english.toml a un novo ficheiro co nome do teu idioma, traduce cada valor base e mantén todos os marcadores como {ORANGE}, {}{} e {SIGNED_WORD} sen cambios. Despois executa tools/check_translations.py para verificar que as claves e os marcadores coincidan coa orixe en inglés."
DOC_TRANS_HOW_P3 = "As traducións aceptanse mediante pull requests de GitHub. Consulta README_zh.md e TRANSLATING.md no repositorio para máis detalles."
DOC_TRANS_HISTORY = "Historia"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x e 4.x enviaban as traducións como ficheiros .lng xestionados co #openttdcoop Web Translator. FIRS 5 eliminou as traducións. CIRS restaura a tradución comunitaria cun fluxo de traballo TOML máis sinxelo e revisable."
DOC_TRANS_THANKS = "Grazas a todos os que traduciron FIRS ao longo dos anos; o voso traballo é a base da tradución ao chinés incluída aquí."

