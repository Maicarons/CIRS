# translations
DOC_TRANS_TITLE = "Tradukoj"
DOC_TRANS_INTRO = "CIRS estas komunuma forko de FIRS kun tradukoj malfermitaj al ĉiuj. Malsame ol FIRS 5, CIRS liveras ludan kaj retejan tekston en pluraj lingvoj."
DOC_TRANS_CURRENT = "Nuntempe subtenataj lingvoj"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "Kiel kontribui tradukon"
DOC_TRANS_HOW_P1 = "La ludoteksto troviĝas en src/grf/lang/*.toml (NewGRF-ĉenoj) kaj src/gs/lang/*.toml (GameScript-ĉenoj). La reteja teksto troviĝas en src/docs/lang/*.toml kaj src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Kopiu english.toml al nova dosiero nomita laŭ via lingvo, traduku ĉiun bazvaloron, kaj konservu ĉiujn anstataŭigilojn kiel {ORANGE}, {}{} kaj {SIGNED_WORD} senŝanĝaj. Poste rulu tools/check_translations.py por certigi ke la ŝlosiloj kaj anstataŭigiloj kongruas kun la angla fonto."
DOC_TRANS_HOW_P3 = "Tradukoj estas akceptataj per GitHub pull requests. Vidu README_zh.md kaj TRANSLATING.md en la deponejo por detaloj."
DOC_TRANS_HISTORY = "Historio"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x kaj 4.x liveris tradukojn kiel .lng dosierojn administratajn per la #openttdcoop Web Translator. FIRS 5 forlasis tradukojn. CIRS revivigas komunuman tradukadon per pli simpla, revizebla TOML-fluo."
DOC_TRANS_THANKS = "Dankon al ĉiuj kiuj tradukis FIRS tra la jaroj; via laboro estas la bazo de la ĉina traduko ĉi tie inkluzivita."

