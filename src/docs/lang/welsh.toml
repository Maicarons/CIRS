# translations
DOC_TRANS_TITLE = "Cyfieithiadau"
DOC_TRANS_INTRO = "Mae CIRS yn fork cymunedol o FIRS gyda chyfieithiadau ar agor i bawb. Yn wahanol i FIRS 5, mae CIRS yn anfon testun gêm a gwefan mewn amrywiaeth o ieithoedd."
DOC_TRANS_CURRENT = "Ieithoedd a gynhelir ar hyn o bryd"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Sut i gyfrannu cyfieithiad"
DOC_TRANS_HOW_P1 = "Mae testun gêm yn src/grf/lang/*.toml (lliniau NewGRF) a src/gs/lang/*.toml (lliniau GameScript). Mae testun gwefan yn src/docs/lang/*.toml a src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copïwch english.toml i ffeil newydd wedi'i enwi ar ôl eich iaith, cyfieithwch bob gwerth sylfaenol, a chadwch bob dalf gnwydd ({ORANGE}, {}{} a {SIGNED_WORD}) heb eu newid. Yna rhowch gynnig ar tools/check_translations.py i wirio bod y allweddi a'r talfannau'n cyfateb i'r ffynhonnell Saesneg."
DOC_TRANS_HOW_P3 = "Derbynnir cyfieithiadau trwy pull requests GitHub. Gweler README_zh.md a TRANSLATING.md yn y ystorfa am fanylion."
DOC_TRANS_HISTORY = "Hanes"
DOC_TRANS_HISTORY_P1 = "Anfonodd FIRS 3.x a 4.x gyfieithiadau fel ffeiliau .lng a reolwyd gyda'r #openttdcoop Web Translator. Fe wnaeth FIRS 5 roi'r gorau i gyfieithiadau. Mae CIRS yn adfer cyfieithu cymunedol gyda llif gwaith TOML symlach, a ellir ei adolygu."
DOC_TRANS_THANKS = "Diolch i bawb a gyfieithodd FIRS dros y blynyddoedd; eich gwaith chi yw sylfaen y cyfieithiad Tsieinëeg sydd wedi'i gynnwys yma."

