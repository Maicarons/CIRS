# translations
DOC_TRANS_TITLE = "翻譯"
DOC_TRANS_INTRO = "CIRS 是 FIRS 的社群分支，提供對所有人開放的翻譯。與 FIRS 5 不同，CIRS 以多種語言提供遊戲文字與網站文字。"
DOC_TRANS_CURRENT = "目前支援的語言"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文（Chinese, Simplified）"
DOC_TRANS_HOW = "如何貢獻翻譯"
DOC_TRANS_HOW_P1 = "遊戲文字位於 src/grf/lang/*.toml（NewGRF 字串）和 src/gs/lang/*.toml（GameScript 字串）。網站文字位於 src/docs/lang/*.toml 和 src/docs/extra_strings*.toml。"
DOC_TRANS_HOW_P2 = "將 english.toml 複製為以你的語言命名的新檔案，翻譯每個基礎值，並保留所有占位符（如 {ORANGE}、{}{} 和 {SIGNED_WORD}）不變。然後執行 tools/check_translations.py，驗證鍵與占位符是否與英語原文一致。"
DOC_TRANS_HOW_P3 = "翻譯透過 GitHub 的 pull request 接受。詳見倉庫中的 README_zh.md 與 TRANSLATING.md。"
DOC_TRANS_HISTORY = "歷史"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x 和 4.x 以 .lng 檔案形式提供翻譯，由 #openttdcoop Web Translator 管理。FIRS 5 放棄了翻譯。CIRS 透過更簡單、可審閱的 TOML 工作流恢復了社群翻譯。"
DOC_TRANS_THANKS = "感謝多年來翻譯 FIRS 的每一個人；你們的工作是此處所包含中文翻譯的基礎。"

