# translations
DOC_TRANS_TITLE = "Traduceri"
DOC_TRANS_INTRO = "CIRS este un fork comunitar al FIRS cu traduceri deschise pentru toți. Spre deosebire de FIRS 5, CIRS livreează textul jocului și al site-ului în mai multe limbi."
DOC_TRANS_CURRENT = "Limbi acceptate în prezent"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Cum să contribui cu o traducere"
DOC_TRANS_HOW_P1 = "Textul jocului se află în src/grf/lang/*.toml (șiruri NewGRF) și src/gs/lang/*.toml (șiruri GameScript). Textul site-ului se află în src/docs/lang/*.toml și src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Copiază english.toml într-un fișier nou numit după limba ta, tradu fiecare valoare de bază și păstrează toți substituenții precum {ORANGE}, {}{} și {SIGNED_WORD} neschimbați. Apoi rulează tools/check_translations.py pentru a verifica că cheile și substituenții corespund sursei în engleză."
DOC_TRANS_HOW_P3 = "Traducerile sunt acceptate prin pull request-uri GitHub. Vezi README_zh.md și TRANSLATING.md în depozit pentru detalii."
DOC_TRANS_HISTORY = "Istoric"
DOC_TRANS_HISTORY_P1 = "FIRS 3.x și 4.x livrau traducerile ca fișiere .lng gestionate cu #openttdcoop Web Translator. FIRS 5 a renunțat la traduceri. CIRS restaurează traducerea comunitară cu un flux de lucru TOML mai simplu și verificabil."
DOC_TRANS_THANKS = "Mulțumiri tuturor celor care au tradus FIRS de-a lungul anilor; munca voastră este baza traducerii în chineză inclusă aici."

