# translations
DOC_TRANS_TITLE = "Eadar-theangachaidhean"
DOC_TRANS_INTRO = "Is e fork coimhearsnachd de FIRS a th' ann an CIRS le eadar-theangachaidhean fosgailte do dh'a h-uile duine. Nas eadar-dhealaichte ri FIRS 5, tha CIRS a' cur a-mach teacsa gèam is làraich-lìn ann an iomadh cànan."
DOC_TRANS_CURRENT = "Cànanan le taic an-dràsta"
DOC_TRANS_LANG_EN = "English"
DOC_TRANS_LANG_ZH = "简体中文"
DOC_TRANS_HOW = "Mar a chuir thu eadar-theangachadh ris"
DOC_TRANS_HOW_P1 = "Tha teacsa gèam ann an src/grf/lang/*.toml (sreathan NewGRF) agus src/gs/lang/*.toml (sreathan GameScript). Tha teacsa na làraich-lìn ann an src/docs/lang/*.toml agus src/docs/extra_strings*.toml."
DOC_TRANS_HOW_P2 = "Dèan leth-bhreac de english.toml gu faidhle ùr air an ainmeachadh às dèidh do chànan, eadar-theangaich gach luach bunasach, agus cùm gach neach-glèidhidh mar {ORANGE}, {}{} agus {SIGNED_WORD} gun atharrachadh. An uairsin ruith tools/check_translations.py gus dearbhadh gu bheil na h-iuchraichean is na luchd-glèidhidh a' freagairt an tùs Beurla."
DOC_TRANS_HOW_P3 = "Thathar a' gabhail ri eadar-theangachaidhean tro pull requests GitHub. Faic README_zh.md agus TRANSLATING.md anns an stòr airson mion-fhiosrachaidh."
DOC_TRANS_HISTORY = "Eachdraidh"
DOC_TRANS_HISTORY_P1 = "Bha FIRS 3.x agus 4.x a' cur a-mach eadar-theangachaidhean mar fhaidhlichean .lng a bha air an stiùireadh leis an #openttdcoop Web Translator. Leig FIRS 5 seachad eadar-theangachaidhean. Tha CIRS ag ath-nuadhachadh eadar-theangachaidh coimhearsnachd le sruth-obrach TOML nas sìmplidh, a ghabhas ath-bhreithneachadh."
DOC_TRANS_THANKS = "Taing dhan a h-uile duine a rinn eadar-theangachadh air FIRS thar nam bliadhnaichean; is e an obair agaibh bunait an eadar-theangachaidh Sìneach a tha san àite seo."

